<title>Owl Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap">

<style>
/* Night Shift. Night is the primary theme; Day is the same token names with
   daylight values. The rules behind these values live in the design system:
   one lamp per screen, time is the layout, round where you touch. */
:root{
  --ground:#0B0E14; --ground-raised:#121722; --ground-hover:#1A2030;
  --rule:#262D3B; --rule-strong:#636D81;
  --ink:#ECE8E1; --ink-muted:#9AA3B2; --ink-faint:#7E889B;
  --lamp:#FFA94D; --lamp-soft:#FFA94D26; --on-lamp:#0B0E14;
  --moon:#DCE3F0; --on-moon:#0B0E14;
  --late:#FF6B5E; --done:#86B596;
  --on-course:#FFFFFF;
  --course-1:#3F74B8; --course-2:#7A5BB5; --course-3:#23866A;
  --course-4:#B04A7A; --course-5:#6B7F24; --course-6:#2F7F91;
  --float:0 10px 30px #00000073;
  --font-display:"Nunito", "SF Pro Rounded", ui-rounded, system-ui, sans-serif;
  --font-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
:root[data-theme="day"]{
  --ground:#E9ECF1; --ground-raised:#F6F7F9; --ground-hover:#DDE2EA;
  --rule:#C9D0DB; --rule-strong:#717E92;
  --ink:#141922; --ink-muted:#4E5868; --ink-faint:#5B6474;
  --lamp:#9A4D00; --lamp-soft:#9A4D0021; --on-lamp:#FFFFFF;
  --moon:#243049; --on-moon:#FFFFFF;
  --late:#B42318; --done:#2F6B45;
  --float:0 10px 30px #1419222E;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="system"]{
    --ground:#E9ECF1; --ground-raised:#F6F7F9; --ground-hover:#DDE2EA;
    --rule:#C9D0DB; --rule-strong:#717E92;
    --ink:#141922; --ink-muted:#4E5868; --ink-faint:#5B6474;
    --lamp:#9A4D00; --lamp-soft:#9A4D0021; --on-lamp:#FFFFFF;
    --moon:#243049; --on-moon:#FFFFFF;
    --late:#B42318; --done:#2F6B45;
    --float:0 10px 30px #1419222E;
    color-scheme:light;
  }
}

*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}

/* ---------- frame ---------- */
.bar{position:sticky;top:0;z-index:40;background:linear-gradient(var(--ground) 70%,transparent);-webkit-app-region:drag}
.bar-in{max-width:1280px;margin:0 auto;padding:28px 56px 16px;display:flex;align-items:center;gap:16px}
.bar button,.bar a,.bar input{-webkit-app-region:no-drag}
.is-mac .bar-in{padding-top:40px}
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--ground-raised);border:1px solid var(--rule);box-shadow:var(--float);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;height:38px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink-muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ground-hover);color:var(--ink);font-weight:600}
.bar .grow{flex:1}
.updated{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted);white-space:nowrap}
.round{width:48px;height:48px;border-radius:999px;border:0;background:var(--ink);color:var(--ground);display:grid;place-items:center;box-shadow:var(--float);cursor:pointer;flex:none}
.round:disabled{opacity:.6;cursor:default}
.round.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.round.sm{width:36px;height:36px;box-shadow:none;background:transparent;color:var(--ink);border:1px solid var(--rule-strong);font-size:18px}
.round.sm:hover{background:var(--ground-hover)}
.wrap{max-width:1280px;margin:0 auto;padding:16px 56px 96px}
@media (max-width:760px){
  .bar-in{padding:16px 16px 12px}
  .is-mac .bar-in{padding-top:36px}
  .wrap{padding:8px 16px 96px}
  .updated{display:none}
}

/* banners float under the tab bar */
.ubar{max-width:1280px;margin:0 auto;padding:0 56px 8px;position:relative;z-index:39}
@media (max-width:760px){.ubar{padding:0 16px 8px}}
.ubar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 12px 12px 24px;background:var(--ground-raised);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--float);font-size:15px;line-height:22px;color:var(--ink-muted)}
.ubar .dotpulse{width:8px;height:8px;border-radius:999px;background:var(--ink-muted);flex:none}
.ubar .utext{flex:1 1 240px}
.ubar .utext b{color:var(--ink);font-weight:600}
.ubar .ubtn{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--lamp);background:var(--lamp);color:var(--on-lamp);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.ubar .ubtn:disabled{opacity:.6}
.ubar .udismiss{height:38px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--ink-muted);cursor:pointer;font-size:14px;font-weight:600}
.ubar .udismiss:hover{color:var(--ink)}

/* ---------- shared pieces ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--ground-hover)}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.text{border-color:transparent;padding:0 12px;color:var(--ink-muted)}
.btn.text:hover{color:var(--ink);background:transparent;text-decoration:underline}
.btn.danger{border-color:transparent;padding:0 12px;color:var(--late)}
.btn.danger:hover{background:transparent;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:default}
.inp{height:38px;background:transparent;border:1px solid var(--rule-strong);border-radius:999px;padding:0 16px;font-size:15px;color:var(--ink)}
.inp:focus{border-color:var(--lamp);outline:none}
textarea.inp{height:auto;min-height:96px;border-radius:16px;padding:12px 16px;width:100%;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
select.inp{padding-right:12px}
.label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:0}
.h1{font-size:28px;line-height:34px;font-weight:600;margin:0}
.lede{margin:6px 0 0;font-size:15px;line-height:22px;color:var(--ink-muted);max-width:70ch}
.msg{margin:8px 0 0;font-size:14px;line-height:20px;color:var(--ink-muted)}
.course{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted);white-space:nowrap}
.course::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--c,var(--ink-muted));flex:none}
.status{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.status.late{color:var(--late)} .status.exam{color:var(--moon)} .status.done{color:var(--done)}
.cap{flex:none;width:44px;height:44px;border-radius:999px;background:var(--c,var(--rule-strong));color:var(--on-course);display:grid;place-items:center}
.cap svg{width:22px;height:22px}
.cap.sm{width:36px;height:36px}.cap.sm svg{width:18px;height:18px}
.cap.xs{width:32px;height:32px}.cap.xs svg{width:16px;height:16px}
.cap.long{height:88px}
.cap.exam{background:var(--moon);color:var(--on-moon)}
.cap.next{box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--lamp),0 0 0 11px var(--lamp-soft)}
.cap.faded{opacity:.4}
.check{appearance:none;width:28px;height:28px;padding:0;border-radius:999px;border:2px solid var(--c,var(--rule-strong));background:transparent;color:var(--on-course);display:grid;place-items:center;cursor:pointer;flex:none}
.check svg{width:16px;height:16px;opacity:0}
.check[aria-pressed="true"]{background:var(--c,var(--rule-strong))}
.check[aria-pressed="true"] svg{opacity:1}
.check:hover{box-shadow:0 0 0 4px var(--ground-hover)}
.toggle{position:relative;flex:none;width:44px;height:26px;padding:0;border-radius:999px;border:2px solid var(--rule-strong);background:transparent;cursor:pointer}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:var(--ink-muted);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.toggle[aria-checked="true"]::after{left:20px;background:var(--ground)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--ground-raised);border:1px solid var(--rule);flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink-muted);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--ground-hover);color:var(--ink);font-weight:600}
.figure{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- agenda ---------- */
.agenda{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:72px;align-items:start}
@media (max-width:1000px){.agenda{grid-template-columns:1fr}.agenda aside{order:-1;margin-bottom:32px}}
.weekhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.weekhead h1{font-size:22px;line-height:28px;font-weight:600}
.weekhead .yr{font-size:22px;line-height:28px;color:var(--ink-muted)}
.weekhead .grow{flex:1}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:40px}
.day{appearance:none;border:0;border-radius:20px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 12px;cursor:pointer;color:var(--ink-muted);min-width:0}
.day:hover{background:var(--ground-hover)}
.day.today{background:var(--ground-raised);box-shadow:inset 0 0 0 1px var(--rule)}
.day .dow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.day .dn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.day.past .dn{color:var(--ink-faint)}
.day.today .dn{background:var(--ink);color:var(--ground)}
.dots{display:flex;align-items:center;height:10px}
.dots i{width:10px;height:10px;border-radius:999px;background:var(--c,var(--rule-strong));box-shadow:0 0 0 2px var(--ground);margin-left:-3px}
.dots i:first-child{margin-left:0}
.day.today .dots i{box-shadow:0 0 0 2px var(--ground-raised)}
.dots i.exam{background:var(--moon)}
.dots b{font-size:11px;font-weight:600;color:var(--ink-muted);margin-left:4px}
.tl{position:relative;list-style:none;margin:0;padding:0}
.tl::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--rule)}
.it{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:16px;padding:8px 0}
.it .body{min-width:0}
.when{font-size:14px;line-height:20px;font-weight:500;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.it.next .when{color:var(--lamp)} .it.late .when{color:var(--late)}
.name{display:block;margin-top:2px;font-size:17px;line-height:23px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;text-decoration:none}
a.name:hover{text-decoration:underline}
.it.done .name{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1px}
.it.done .when{color:var(--ink-faint)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:4px}
.dh{position:relative;display:flex;align-items:baseline;gap:10px;padding:36px 0 10px 60px}
.dh:first-child{padding-top:8px}
.dh::before{content:"";position:absolute;left:16px;bottom:14px;width:12px;height:12px;border-radius:999px;background:var(--ground);border:2px solid var(--rule-strong)}
.dh b{font-size:16px;line-height:22px;font-weight:600;color:var(--ink)}
.dh span{font-size:15px;line-height:22px;color:var(--ink-muted)}
.dh em{margin-left:auto;font-style:normal;font-size:14px;line-height:20px;color:var(--ink-faint)}
.dh.late b{color:var(--late)}
.dh.flash b{color:var(--lamp)}
.fold{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:16px;padding:0 0 12px}
.fold .cap{background:var(--ground-hover);color:var(--done)}
.minis{display:flex}
.minis .cap{width:26px;height:26px;margin-left:-8px;box-shadow:0 0 0 2px var(--ground);opacity:.55;background:var(--c)}
.minis .cap:first-child{margin-left:0}
.minis .cap svg{width:14px;height:14px}
.fold-t{font-size:15px;line-height:22px;color:var(--ink-muted)}
.side h2{margin-bottom:4px}
.srow{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:12px;align-items:start;padding:10px 0}
.srow .t{font-size:15px;line-height:21px;font-weight:600;color:var(--ink);text-decoration:none}
.srow a.t:hover{text-decoration:underline}
.srow .s{margin-top:2px;font-size:14px;line-height:20px;color:var(--ink-muted)}
.extra{margin-top:48px}
.extra h2{margin-bottom:8px}
.empty{padding:48px 16px;text-align:center}
.empty h2{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.empty p{margin:8px auto 0;max-width:44ch;font-size:15px;line-height:22px;color:var(--ink-muted)}
.fab{position:fixed;right:32px;bottom:32px;z-index:30}
.addsheet{position:fixed;right:32px;bottom:96px;z-index:31;width:min(420px,calc(100vw - 32px));padding:20px;border-radius:24px;background:var(--ground-raised);border:1px solid var(--rule);box-shadow:var(--float);display:flex;flex-direction:column;gap:10px}
.addsheet .row2{display:flex;gap:8px;flex-wrap:wrap}
.addsheet .row2 .inp{flex:1;min-width:120px}
@media (max-width:760px){.fab{right:16px;bottom:16px}.addsheet{right:16px;bottom:80px}}

/* ---------- calendar ---------- */
.calv{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:48px;align-items:start}
@media (max-width:1000px){.calv{grid-template-columns:1fr}.calv aside{margin-top:32px}}
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.calhead .yr{font-size:28px;line-height:34px;color:var(--ink-muted)}
.calhead .grow{flex:1}
.dows,.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dows span{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);padding:0 8px 8px}
.cell{appearance:none;display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0;height:128px;padding:8px;border:0;border-radius:16px;background:transparent;text-align:left;cursor:pointer;overflow:hidden;color:var(--ink)}
.cell:hover{background:var(--ground-hover)}
.cell.sel{background:var(--ground-raised);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.cell .dn{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;flex:none}
.cell.out .dn{color:var(--ink-faint)}
.cell.today .dn{background:var(--ink);color:var(--ground)}
.chip{display:flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:999px;background:var(--c,var(--rule-strong));color:var(--on-course);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0;flex:none}
.chip svg{width:12px;height:12px;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.exam{background:var(--moon);color:var(--on-moon)}
.chip.done{background:transparent;color:var(--ink-faint);box-shadow:inset 0 0 0 1px var(--rule)}
.chip.next{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--lamp)}
.chip.late{background:transparent;color:var(--late);box-shadow:inset 0 0 0 1px var(--late)}
.cell .more{font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted);padding-left:4px}
.dayside h2{font-size:20px;line-height:26px;font-weight:600}
.dayside .sub{margin-top:2px;font-size:14px;line-height:20px;color:var(--ink-muted)}
.dayside .tl{margin-top:16px}
.dayside .tl::before{display:none}
@media (max-width:760px){.cell{height:92px;padding:4px}.chip span{display:none}.chip{padding:0 5px}.calhead{flex-wrap:wrap}.calhead .h1,.calhead .yr{font-size:22px;line-height:28px}.weekhead h1,.weekhead .yr{font-size:18px}}

/* ---------- classes ---------- */
.clsgrid{display:grid;grid-template-columns:56px minmax(0,1.2fr) minmax(0,1.4fr) 140px 110px;column-gap:24px;align-items:center}
.clshead{padding-bottom:8px;border-bottom:1px solid var(--rule);margin-top:40px}
.clsrow{padding:20px 0;border-bottom:1px solid var(--rule)}
.badge{width:56px;height:56px;border-radius:999px;background:var(--c);color:var(--on-course);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.01em}
.clsrow .nm{font-size:18px;line-height:24px;font-weight:600}
.clsrow .cd{margin-top:2px;font-size:14px;line-height:20px;color:var(--ink-muted)}
.nextup{display:flex;gap:12px;align-items:center;min-width:0}
.nextup .w{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted)}
.nextup .w.lamp{color:var(--lamp)}
.nextup .n{font-size:15px;line-height:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .none{font-size:15px;line-height:21px;color:var(--ink-faint)}
.wk{font-size:14px;line-height:20px;color:var(--ink-muted)}
.gradecell{text-align:right;font-size:36px}
.gradecell.none{color:var(--ink-faint)}
@media (max-width:900px){
  .clsgrid{grid-template-columns:56px minmax(0,1fr) auto;row-gap:12px}
  .clshead{display:none}
  .clsrow .nextup{grid-column:2 / -1}
  .clsrow .wk{grid-column:2}
}

/* ---------- grades ---------- */
.grow-btn{width:100%;display:grid;grid-template-columns:130px minmax(0,1fr) 32px;column-gap:24px;align-items:center;padding:18px 0;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.grow-btn .figure{font-size:46px}
.grow-btn .figure.none{color:var(--ink-faint)}
.grow-btn .gn{display:flex;flex-direction:column;gap:10px;min-width:0}
.grow-btn .gt{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.grow-btn .gt b{font-size:18px;line-height:24px;font-weight:600}
.grow-btn .gs{font-size:14px;color:var(--ink-muted)}
.grow-btn .chev{font-size:18px;color:var(--ink-muted);text-align:center}
.bar6{display:block;height:6px;border-radius:999px;background:var(--rule);position:relative;overflow:hidden}
.bar6 i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c,var(--ink-muted))}
.bar6.low i{background:var(--late)}
.gdetail{padding:8px 0 24px 154px}
.gtable{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px 110px;column-gap:16px;align-items:center}
.gtable > *{padding:10px 0;border-bottom:1px solid var(--rule)}
.gtable .h{padding:0 0 8px}
.gtable .r{text-align:right;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.wi{justify-self:end;width:84px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.wi:focus{border-color:var(--lamp);outline:none}
.wi.filled{border-color:var(--lamp);color:var(--lamp)}
.gnote{margin:14px 0 0;font-size:14px;line-height:20px;color:var(--ink-muted);max-width:75ch}
@media (max-width:760px){
  .grow-btn{grid-template-columns:96px minmax(0,1fr) 24px;column-gap:14px}
  .grow-btn .figure{font-size:34px}

<script>
(function(){
"use strict";

var DEFAULT_DATA = /*__DATA__*/null;
var APP_VERSION  = /*__VERSION__*/"dev";
/* A personal build carries its own coursework. Downloading the public
   release would replace it with an empty one, so never offer that here. */
var PERSONAL     = /*__PERSONAL__*/false;
var REPO         = "Unknownce0/owl-hours";

/* Fall 2026 term window. Anything due outside this is a leftover from a
   copied-forward course shell, not something you actually owe. */
var TERM_START = new Date(2026,7,1).getTime();
var TERM_END   = new Date(2027,0,15).getTime();

var K = {data:"owlhours.data.v1", done:"owlhours.done.v1", todos:"owlhours.todos.v1",
         whatif:"owlhours.whatif.v1", ui:"owlhours.ui.v1", sync:"owlhours.sync.v1",
         upd:"owlhours.update.v1", aleks:"owlhours.aleks.v1", gs:"owlhours.gradescope.v1"};
/* The degree planner was removed; clear what it stored. */
try { localStorage.removeItem("owlhours.degree.v1"); } catch(e){}

function load(k,f){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var stored   = load(K.data,null);

/* An update ships a fresh snapshot baked in, but the browser copy is usually
   newer still — it came from a live scrape. Pick whichever was scraped last
   rather than blindly preferring either, so an update never throws away work
   you have since submitted, and a stale copy never hides an update. */
function scrapeTime(d){ return d && d.scrapedAt ? (Date.parse(d.scrapedAt) || 0) : 0; }
function carryExtras(from, into){
  if(!from || !into || !into.courses) return into;
  var mine = {};
  (from.courses||[]).forEach(function(c){
    var ex = (c.items||[]).filter(function(i){ return i.x; });
    if(ex.length) mine[c.id] = ex;
  });
  into.courses.forEach(function(c){
    var ex = mine[c.id]; if(!ex) return;
    var have = {}; (c.items||[]).forEach(function(i){ have[i.n] = 1; });
    ex.forEach(function(i){ if(!have[i.n]) (c.items = c.items || []).push(i); });
  });
  return into;
}

var DATA;
if(stored && DEFAULT_DATA && scrapeTime(DEFAULT_DATA) > scrapeTime(stored)){
  DATA = carryExtras(stored, JSON.parse(JSON.stringify(DEFAULT_DATA)));
  save(K.data, DATA);                      /* keep the newer one */
} else {
  DATA = stored || DEFAULT_DATA || {v:1,courses:[]};
}
/* ALEKS rows written before pulls were tagged src:"aleks" can never be
   replaced: a pull clears only tagged rows, so every old "Not Submitted" copy
   sat beside its fresh "Completed" twin forever. Once a course has any tagged
   ALEKS row, the untagged ones are stale by definition — drop them. */
function isLegacyAleks(i){ return !i.src && i.x && /\(ALEKS\)\s*$/.test(i.n||""); }
(function(){
  var dropped = 0;
  (DATA.courses||[]).forEach(function(c){
    var items = c.items||[];
    if(!items.some(function(i){ return i.src === "aleks"; })) return;
    c.items = items.filter(function(i){ if(isLegacyAleks(i)){ dropped++; return false; } return true; });
  });
  if(dropped) save(K.data, DATA);
})();
/* Early calendar pulls invented a "Not Submitted" status and let in textbook
   chapters and discussion due dates. Current pulls never set a status on a
   calendar row, so a status marks a row from that version. Keep the exams
   (minus the invented status); drop the rest — the next pull re-adds anything
   that still belongs. Runs offline, so it cannot be lost to a failed pull. */
(function(){
  var changed = 0;
  (DATA.courses||[]).forEach(function(c){
    c.items = (c.items||[]).filter(function(i){
      if(i.src !== "cal" || !i.s) return true;
      changed++;
      if(i.exam){ delete i.s; return true; }
      return false;
    });
  });
  if(changed) save(K.data, DATA);
})();
var isCustom = !!stored;
var isEmpty  = !DATA.courses || !DATA.courses.length;
var sync     = load(K.sync,{url:"",auto:false});
var done     = load(K.done,{});
var todos    = load(K.todos,[]);
var whatif   = load(K.whatif,{});
var ui       = load(K.ui,{view:"agenda",off:{}});
if(!ui.off) ui.off={};
/* Settings that used to be "hide" switches are now "show" switches. */
if(ui.hideStale){ ui.showStale = false; delete ui.hideStale; }
if(ui.hideDone){ ui.showDone = false; delete ui.hideDone; }
if(!ui.theme) ui.theme = "night";
document.documentElement.setAttribute("data-theme", ui.theme);
if(/Mac/i.test(navigator.platform||"") && window.owl && window.owl.isDesktop) document.documentElement.classList.add("is-mac");

var TYPE = {a:"assignment", q:"quiz", d:"discussion"};
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };

/* ---------- shaping the raw D2L dump into things with dates and identity ---------- */
function courseCode(t){
  var m = t.match(/\b([A-Z]{2,4})\s?(\d{4}[A-Z]?)\b/);
  if(m) return m[1]+" "+m[2];
  var w = t.replace(/\b(Section|Group|XLS|Lab|Fall|Semester|CO)\b/g,"").trim().split(/\s+/);
  return w.slice(0,2).join(" ").toUpperCase();
}
function courseName(t){
  return t.replace(/\s+Section\s+\w+/,"").replace(/\s+XLS\s+Group(\s+\w+)?/,"")
          .replace(/\s+Lab\b/," Lab").replace(/\s+CSE\s?\d{4}[A-Z]?/,"").replace(/\s+\d{4}[A-Z]?\s*$/,"").trim();
}
var courses = (DATA.courses||[]).map(function(c,i){
  return { id:c.id, raw:c.title, name:courseName(c.title), code:c.code||courseCode(c.title),
           color:"var(--course-"+((i%6)+1)+")", idx:i, grades:c.grades||[], fc:c.fc||null };
});
var byId = {}; courses.forEach(function(c){ byId[c.id]=c; });

var items = [];
(DATA.courses||[]).forEach(function(c){
  /* An exam found in an announcement steps aside once the same exam shows up
     on the calendar (within a day and a half), so it is never listed twice. */
  var calExams = (c.items||[]).filter(function(i){ return i.src === "cal" && i.exam && i.d; })
                              .map(function(i){ return Date.parse(i.d); });
  (c.items||[]).forEach(function(it){
    if(it.src === "ann" && it.d && calExams.some(function(t){ return Math.abs(t - Date.parse(it.d)) < 36*36e5; })) return;
    var due = it.d ? new Date(it.d) : null;
    var t   = TYPE[it.t] || "item";
    /* A calendar exam attached to no D2L quiz is sat in a room, not online. */
    var ev  = it.src === "cal" || it.src === "ann";
    var isExam = ev && !!it.exam;
    items.push({
      key: c.id+"|"+it.t+"|"+it.n,
      course: c.id, type: isExam ? "exam" : t,
      name: ev ? String(it.n).replace(/\s*\(scheduled\)\s*$/,"") : it.n,
      event: ev, exam: isExam, timed: !!it.timed, where: it.where || null,
      src: it.src || null, mode: it.mode || null, allDay: !!it.allDay,
      /* ALEKS reports a percentage: progress while open, the final score once closed */
      aleksPct: (it.src === "aleks" && it.e != null) ? it.e : null,
      end: it.end ? new Date(it.end) : null,
      due: due, opens: it.o?new Date(it.o):null,
      url: it.u ? "https://kennesaw.view.usg.edu"+it.u : null,
      status: it.s||null, points: (it.p!=null?it.p:null),
      /* shown as the done status ("47/50"); never used to decide done */
      score: (it.e!=null && it.src!=="aleks" && it.e>0) ? it.e : null,
      attempts: it.at, maxAttempts: it.am, section: it.sec||null,
      stale: !!(due && (due.getTime()<TERM_START || due.getTime()>TERM_END)),
      todo:false
    });
  });
});
function allItems(){
  return items.concat(todos.map(function(t){
    return { key:"todo|"+t.id, course:t.course||"", type:"todo", name:t.name,
             due:t.due?new Date(t.due):null, opens:null, url:null, status:null,
             points:null, stale:false, todo:true, tid:t.id };
  }));
}

/* ---------- time ---------- */
var now = new Date();
function sod(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }
var TODAY = sod(now);
var DAY = 864e5;
function daysOut(d){ return Math.round((sod(d)-TODAY)/DAY); }
function fmtDate(d){
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
    (d.getFullYear()!==2026 ? ", "+d.getFullYear() : "");
}
function fmtTime(d){
  var h=d.getHours(), m=d.getMinutes();
  if(h===23&&m>=58) return "11:59p";
  return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}).replace(/\s?([AP])M/i,function(_,a){return a.toLowerCase();});
}
function relative(d){
  var n = daysOut(d);
  if(n===0){
    var hrs = Math.round((d.getTime()-now.getTime())/36e5);
    if(hrs<0) return {t:"overdue",c:"late"};
    if(hrs<=1) return {t:"< 1 hr",c:"late"};
    return {t:"in "+hrs+" hr",c:"hot"};
  }
  if(n<0)  return {t:Math.abs(n)+"d ago", c:"late"};
  if(n===1) return {t:"tomorrow", c:"hot"};
  if(n<=7) return {t:"in "+n+"d", c:"hot"};
  return {t:"in "+n+"d", c:""};
}

/* ---------- filtering ---------- */
/* D2L and ALEKS already tell us what is finished - a submission status, a score,
   a closed assignment. Read that instead of waiting to be told twice.
   done[key] is the manual override: 1 = ticked by hand, 0 = un-ticked by hand. */
function tookPlace(it){
  var fin = it.end || it.due;
  return !!(it.event && it.timed && fin && fin.getTime() < now.getTime());
}
function autoDone(it){
  if(it.todo) return false;
  /* Nothing is handed in for an exam you sit in a room — once it is over, it
     happened. Before this it read as "overdue" forever. */
  if(it.event && it.timed) return tookPlace(it);
  /* Rows saved before this rule: ALEKS auto-submits at the deadline, so any
     progress on a closed ALEKS assignment is a submitted score. */
  if(it.src === "aleks" && it.aleksPct > 0 && it.due && it.due.getTime() < now.getTime()) return true;
  var s = it.status || "";
  if(/not submitted|not started|no submission/i.test(s)) return false;
  /* D2L writes "1 Submission, 1 File" for handed-in work - note "Submission",
     not "Submitted", which an obvious-looking regex misses entirely. */
  if(/\d+\s*submission/i.test(s)) return true;
  if(/submitted|completed|graded|closed|feedback/i.test(s)) return true;
  /* Gradescope shows a bare score ("105.0 / 100.0") once something is graded. */
  if(/^\s*-?[\d.]+\s*\/\s*[\d.]+\s*$/.test(s)) return true;
  if(it.earned != null) return true;
  /* D2L counts an attempt from the moment you START a quiz, so an attempt
     alone can mean "taking it right now". A graded quiz is caught above (the
     gradebook marks it Completed); otherwise an attempt only settles it once
     the quiz has closed. Before that it is "attempt started", not done. */
  if(it.attempts != null && it.attempts > 0 && it.due && it.due.getTime() < now.getTime()) return true;
  return false;
}
function isDone(it){
  var m = done[it.key];
  if(m === 1) return true;
  if(m === 0) return false;
  return autoDone(it);
}

function visible(){
  return allItems().filter(function(it){
    if(it.course && ui.off[it.course]) return false;
    return true;
  });
}
function bucketOf(it){
  if(it.stale) return "stale";
  if(!it.due)  return "undated";
  if(tookPlace(it)) return "past";
  var n = daysOut(it.due);
  if(it.due.getTime() < now.getTime() && n<=0) return "overdue";
  if(n===0) return "today";
  if(n===1) return "tomorrow";
  if(n<=7)  return "week";
  return "later";
}
var BUCKETS = [
  {k:"overdue",  label:"Overdue",             cls:"is-overdue"},
  {k:"today",    label:"Today",               cls:"is-now"},
  {k:"tomorrow", label:"Tomorrow",            cls:"is-now"},
  {k:"week",     label:"Next 7 days",         cls:""},
  {k:"later",    label:"Later this term",     cls:""},
  {k:"past",     label:"Already happened",    cls:""},
  {k:"undated",  label:"No due date in D2L",  cls:""},
  {k:"stale",    label:"Check these dates",   cls:""}
];

/* ---------- the pieces every screen shares ---------- */
/* One icon per kind of work, drawn for Owl Hours on a 24px grid. The capsule's
   color says which class; the icon says what kind of work it is. */
var ICON = {
  quiz:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L8 4.5M3.5 12l1.5 1.5L8 10.5"/><circle cx="5.5" cy="18" r="1.6"/>',
  assignment:'<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 17h5"/>',
  discussion:'<path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h9A1.5 1.5 0 0 1 15 5.5v6a1.5 1.5 0 0 1-1.5 1.5H8l-3.5 3v-3A1.5 1.5 0 0 1 3 11.5z"/><path d="M18 8h1.5A1.5 1.5 0 0 1 21 9.5v6a1.5 1.5 0 0 1-1.5 1.5V20L16 17h-4.5A1.5 1.5 0 0 1 10 15.5V15"/>',
  exam:'<path d="M4 20l1.2-4.4L15.8 5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8z"/><path d="M13.5 7.3l3.2 3.2M4 20h16"/>',
  aleks:'<path d="M3 13.5h2.5l3 6.5L14 4h7"/><path d="M15 10.5l5 5M20 10.5l-5 5"/>',
  gradescope:'<circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.3"/>',
  event:'<rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M8.5 3v4.5M15.5 3v4.5"/><circle cx="12" cy="15" r="1.3"/>',
  todo:'<path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
function icon(k, w){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2.2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[k]||ICON.assignment)+'</svg>';
}
var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* A quiz named like an exam ("COMM 1100 MIDTERM EXAM", "Final Exam") is one,
   whichever D2L tool it happens to live in. */
function examLike(it){
  var n = it.name || "";
  return !!it.exam || (it.type === "quiz" && /\b(midterm|final exam|exam|test \d+)\b/i.test(n) &&
                       !/study guide|review|practice|set ?up|scratch/i.test(n));
}
function kindOf(it){
  if(it.todo) return "todo";
  if(examLike(it)) return "exam";
  /* older rows carry the source only in their name */
  if(it.src === "aleks" || /\(ALEKS\)\s*$/.test(it.name||"")) return "aleks";
  if(it.src === "gs" || /\(Gradescope\)\s*$/.test(it.name||"")) return "gradescope";
  if(it.event) return "event";
  if(it.type === "quiz") return "quiz";
  if(it.type === "discussion") return "discussion";
  return "assignment";
}
function courseColor(it){ var c = byId[it.course]; return c ? c.color : "var(--rule-strong)"; }
function capHTML(it, o){
  o = o || {};
  var k = kindOf(it);
  var cls = "cap" + (o.size ? " "+o.size : "") + (k === "exam" ? " exam" : "") +
            (o.next ? " next" : "") + (o.faded ? " faded" : "") + (o.long ? " long" : "");
  return '<span class="'+cls+'" style="--c:'+courseColor(it)+'">'+icon(k)+'</span>';
}
function courseTag(c){ return c ? '<span class="course" style="--c:'+c.color+'">'+esc(c.code)+'</span>' : ''; }
function statusHTML(pair){ return pair ? '<span class="status '+(pair[0]||"")+'">'+esc(pair[1])+'</span>' : ''; }

function fmtClock(d){ return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function fmtSpan(it){
  if(!it.due) return "";
  if(it.allDay) return "All day";
  var a = fmtClock(it.due);
  if(it.event && it.end && it.end > it.due){
    var b = fmtClock(it.end);
    var ma = a.match(/\s?([AP]M)$/i), mb = b.match(/\s?([AP]M)$/i);
    if(ma && mb && ma[1] === mb[1]) a = a.replace(/\s?[AP]M$/i, "");
    return a + "–" + b;
  }
  return a;
}
function fmtDay(d, withWeekday){
  return d.toLocaleDateString(undefined, withWeekday ? {weekday:"short",month:"short",day:"numeric"} : {month:"short",day:"numeric"}) +
         (d.getFullYear() !== now.getFullYear() ? ", "+d.getFullYear() : "");
}
/* time left before the next item: "7h 12m", or "4d 6h" from two days out */
function countdown(ms){
  var m = Math.max(0, Math.floor(ms/60000)), d = Math.floor(m/1440), h = Math.floor((m%1440)/60);
  return d >= 2 ? d+"d "+h+"h" : Math.floor(m/60)+"h "+(m%60)+"m";
}
function dayLabel(dayMs){
  var n = Math.round((dayMs - TODAY)/DAY);
  if(n < 1) return "";
  if(n === 7) return "in 1 week";
  return "in "+n+(n === 1 ? " day" : " days");
}
function isOverdue(it){ return !!(it.due && !it.stale && it.due.getTime() < now.getTime() && !isDone(it) && !tookPlace(it)); }

/* The one status word an item gets: whatever changes what you do next. */
function statusOf(it){
  var complete = isDone(it);
  if(examLike(it)){
    if(tookPlace(it)) return ["", "Took place"];
    var where = it.mode === "online" ? "Exam · online" : it.where ? "Exam · in person · "+it.where
              : (it.src === "cal" && it.timed) ? "Exam · likely in person" : "Exam";
    if(it.src === "ann" && !it.mode) where += " · from announcement";
    return ["exam", where];
  }
  if(complete){
    if(it.score != null && it.points) return ["done", (+it.score).toString()+"/"+it.points];
    if(it.aleksPct != null) return ["done", it.aleksPct+"%"];
    return ["done", "Done"];
  }
  if(isOverdue(it)) return ["late", "Overdue"];
  if(it.aleksPct != null) return ["", it.aleksPct+"% done"];
  if(it.type === "quiz" && it.attempts > 0) return ["", "Attempt started"];
  if(it.todo) return ["", "Your task"];
  return null;
}

/* The next thing: the soonest unfinished item that hasn't passed. It is the
   only thing on a screen that gets the lamp. */
function nextItem(){
  var t = now.getTime(), best = null;
  visible().forEach(function(it){
    if(!it.due || it.stale || isDone(it) || it.due.getTime() < t) return;
    if(!best || it.due < best.due) best = it;
  });
  return best;
}

/* One row on a timeline: capsule, time, name, class and status, check. */
function itemRow(it, o){
  o = o || {};
  var complete = isDone(it), c = byId[it.course];
  var next = !!o.next, late = isOverdue(it);
  var k = kindOf(it);
  /* tall = most of the work still left, which only ALEKS reports */
  var long = !complete && k === "aleks" && it.aleksPct != null && it.aleksPct < 50 && !late;
  var cls = "it" + (next ? " next" : "") + (late ? " late" : "") + (complete ? " done" : "");
  var when = o.when != null ? o.when : fmtSpan(it);
  if(next && it.due) when += " · in "+countdown(it.due.getTime() - now.getTime());
  var name = it.url ? '<a class="name" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.name)+'</a>'
                    : '<span class="name">'+esc(it.name)+'</span>';
  return '<li class="'+cls+'">'+capHTML(it,{next:next, faded:complete, long:long})+
    '<div class="body"><div class="when">'+esc(when)+'</div>'+name+
    '<div class="meta">'+courseTag(c)+statusHTML(statusOf(it))+'</div></div>'+
    '<button class="check" style="--c:'+courseColor(it)+'" aria-pressed="'+complete+'" data-check="'+esc(it.key)+'" aria-label="Mark '+esc(it.name)+(complete?' not done':' done')+'">'+CHECK_SVG+'</button></li>';
}

/* ---------- agenda ---------- */
var weekOffset = 0, agendaAll = false, foldOpen = false;
function weekStartOf(t){
  var d = new Date(t), back = (d.getDay() - (ui.weekStart === 0 ? 0 : 1) + 7) % 7;
  return sod(new Date(d.getFullYear(), d.getMonth(), d.getDate() - back));
}
function dayKey(t){ return sod(new Date(t)); }

function renderAgenda(){
  var el = document.getElementById("v-agenda");
  var vis = visible();
  var dated = vis.filter(function(i){ return i.due && !i.stale; });
  var t = now.getTime();
  var wk0 = weekStartOf(TODAY);
  var nx = nextItem();

  /* week strip */
  var ws = weekStartOf(TODAY + weekOffset*7*DAY);
  var perDay = {};
  dated.forEach(function(i){ var k = dayKey(i.due); (perDay[k] = perDay[k] || []).push(i); });
  var days = '';
  for(var d=0; d<7; d++){
    var dd = new Date(ws + d*DAY + 3*36e5), key = sod(dd);
    var list = (perDay[key]||[]).sort(function(a,b){ return a.due-b.due; });
    var dots = list.slice(0,4).map(function(i){
      return examLike(i) ? '<i class="exam"></i>' : '<i style="--c:'+courseColor(i)+'"></i>';
    }).join('') + (list.length > 4 ? '<b>+'+(list.length-4)+'</b>' : '');
    days += '<button class="day'+(key===TODAY?" today":"")+(key<TODAY?" past":"")+'" data-jump="'+key+'" aria-label="'+
            esc(dd.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))+', '+list.length+' due">'+
            '<span class="dow">'+dd.toLocaleDateString(undefined,{weekday:"short"})+'</span>'+
            '<span class="dn">'+dd.getDate()+'</span><span class="dots">'+dots+'</span></button>';
  }
  var we = new Date(ws + 6*DAY + 3*36e5), wsD = new Date(ws + 3*36e5);
  var range = wsD.getMonth() === we.getMonth()
    ? wsD.toLocaleDateString(undefined,{month:"short"})+" "+wsD.getDate()+"–"+we.getDate()
    : fmtDay(wsD)+" – "+fmtDay(we);
  var h = '<div class="agenda"><div class="main">';
  h += '<section aria-label="This week"><div class="weekhead"><h1>'+esc(range)+'</h1><span class="yr">'+we.getFullYear()+'</span><span class="grow"></span>'+
       (weekOffset ? '<button class="btn text" id="wk-now">This week</button>' : '')+
       '<button class="round sm" id="wk-prev" aria-label="Previous week">‹</button>'+
       '<button class="round sm" id="wk-next" aria-label="Next week">›</button></div>'+
       '<div class="week">'+days+'</div></section>';

  /* the timeline */
  var folded = [], overdue = [], upcoming = [], earlier = [];
  dated.forEach(function(i){
    var past = i.due.getTime() < t || tookPlace(i);
    if(isOverdue(i)){ overdue.push(i); return; }
    if(isDone(i) || (past && tookPlace(i))){
      if(!ui.showDone){ if(dayKey(i.due) >= wk0) folded.push(i); return; }
      if(past){ if(dayKey(i.due) >= wk0) earlier.push(i); return; }
    }
    if(past) return;
    upcoming.push(i);
  });
  var byDue = function(a,b){ return a.due-b.due; };
  overdue.sort(byDue); upcoming.sort(byDue); earlier.sort(byDue);
  var LIMIT = TODAY + 15*DAY, hiddenLater = 0;
  if(!agendaAll){
    hiddenLater = upcoming.filter(function(i){ return i.due.getTime() >= LIMIT; }).length;
    upcoming = upcoming.filter(function(i){ return i.due.getTime() < LIMIT; });
  }

  var tl = '';
  if(folded.length){
    folded.sort(byDue);
    tl += '<li class="fold"><span class="cap">'+CHECK_SVG+'</span><div style="display:flex;align-items:center;gap:12px;min-width:0">'+
          '<span class="minis">'+folded.slice(0,6).map(function(i){ return '<span class="cap" style="--c:'+courseColor(i)+'">'+icon(kindOf(i),2.4)+'</span>'; }).join('')+'</span>'+
          '<span class="fold-t">'+folded.length+' done this week</span></div>'+
          '<button class="btn text" id="fold-t" aria-expanded="'+foldOpen+'">'+(foldOpen?"Hide":"Show")+'</button></li>';
    if(foldOpen) tl += folded.map(function(i){ return itemRow(i,{when:fmtDay(i.due,true)+" · "+fmtSpan(i)}); }).join('');
  }
  if(overdue.length){
    tl += '<li class="dh late"><b>Overdue</b><span>'+overdue.length+' past due</span></li>';
    tl += overdue.map(function(i){
      var ago = Math.max(1, Math.round((TODAY - dayKey(i.due))/DAY));
      return itemRow(i,{when: fmtDay(i.due,true)+" · "+fmtSpan(i)+(dayKey(i.due)===TODAY ? "" : " · "+ago+(ago===1?" day ago":" days ago"))});
    }).join('');
  }
  var groups = [], gi = {};
  earlier.concat(upcoming).forEach(function(i){
    var k = dayKey(i.due);
    if(!(k in gi)){ gi[k] = groups.length; groups.push({k:k, items:[]}); }
    groups[gi[k]].items.push(i);
  });
  groups.forEach(function(g){
    var dd = new Date(g.k + 3*36e5);
    var title = g.k === TODAY ? "Today" : g.k === TODAY+DAY ? "Tomorrow" : dd.toLocaleDateString(undefined,{weekday:"long"});
    var sub = g.k === TODAY || g.k === TODAY+DAY ? dd.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})
                                               : fmtDay(dd);
    tl += '<li class="dh" id="dh-'+g.k+'"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span>'+
          (g.k > TODAY+DAY ? '<em>'+dayLabel(g.k)+'</em>' : '')+'</li>';
    tl += g.items.map(function(i){ return itemRow(i,{next: nx && i.key === nx.key}); }).join('');
  });

  if(!tl){
    h += '<div class="empty"><h2>'+(overdue.length ? "" : "All caught up.")+'</h2><p>Nothing left on your timeline'+
         (DESKTOP ? '. Owl Hours checks D2L again every 6 hours.' : '.')+'</p></div>';
  } else {
    h += '<section aria-label="Timeline"><ol class="tl">'+tl+'</ol></section>';
    if(hiddenLater) h += '<p style="margin:24px 0 0 60px"><button class="btn" id="tl-more">Show '+hiddenLater+' more after '+esc(fmtDay(new Date(LIMIT)))+'</button></p>';
  }

  var stale = vis.filter(function(i){ return i.stale; });
  var undated = vis.filter(function(i){ return !i.due && !i.stale && !isDone(i); });
  if(ui.showStale !== false && stale.length){
    h += '<section class="extra"><h2 class="label">Check these dates</h2><p class="msg">D2L dates these outside this term, usually because the class copied last year’s shell. Check the syllabus before trusting them.</p>'+
         '<ol class="tl" style="margin-top:8px">'+stale.map(function(i){ return itemRow(i,{when:"Dated "+fmtDay(i.due)}); }).join('')+'</ol></section>';
  }
  if(ui.showUndated !== false && undated.length){
    h += '<section class="extra"><h2 class="label">No due date</h2>'+
         '<ol class="tl" style="margin-top:8px">'+undated.map(function(i){ return itemRow(i,{when:"No due date in D2L"}); }).join('')+'</ol></section>';
  }
  h += '</div>';

  /* the exams column */
  var exams = vis.filter(function(i){ return examLike(i) && i.due && !i.stale && !isDone(i) && !tookPlace(i) && i.due.getTime() >= t; })
                 .sort(byDue).slice(0,6);
  h += '<aside class="side"><h2 class="label">Exams</h2>';
  h += exams.length ? exams.map(function(i){
    var sub = fmtDay(i.due,true)+" · "+fmtSpan(i)+(i.mode === "online" ? " · online" : i.where ? " · "+i.where : "");
    var t2 = i.url ? '<a class="t" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.name)+'</a>' : '<span class="t">'+esc(i.name)+'</span>';
    return '<div class="srow">'+capHTML(i,{size:"xs"})+'<div>'+t2+'<div style="margin-top:3px">'+courseTag(byId[i.course])+'</div><div class="s">'+esc(sub)+'</div></div></div>';
  }).join('') : '<p class="msg">No exams on your calendar yet.</p>';
  h += '</aside></div>';
  el.innerHTML = h;

  var q = function(id){ return document.getElementById(id); };
  q("wk-prev").onclick = function(){ weekOffset--; renderAgenda(); };
  q("wk-next").onclick = function(){ weekOffset++; renderAgenda(); };
  if(q("wk-now")) q("wk-now").onclick = function(){ weekOffset = 0; renderAgenda(); };
  if(q("fold-t")) q("fold-t").onclick = function(){ foldOpen = !foldOpen; renderAgenda(); };
  if(q("tl-more")) q("tl-more").onclick = function(){ agendaAll = true; renderAgenda(); };
  Array.prototype.forEach.call(el.querySelectorAll("[data-jump]"), function(b){
    b.onclick = function(){
      var k = +this.getAttribute("data-jump"), head = q("dh-"+k);
      if(head){
        head.scrollIntoView({behavior:"smooth", block:"center"});
        head.classList.add("flash"); setTimeout(function(){ head.classList.remove("flash"); }, 1400);
      } else {
        var dd = new Date(k + 3*36e5);
        calM = dd.getMonth(); calY = dd.getFullYear(); calSel = k; show("calendar");
      }
    };
  });
}

function addTodo(){
  var n = document.getElementById("td-name");
  if(!n || !n.value.trim()) return;
  var d = document.getElementById("td-due").value;
  todos.push({ id:Date.now().toString(36), name:n.value.trim(),
               course:document.getElementById("td-course").value,
               due: d ? new Date(d+"T23:59:00").toISOString() : null });
  save(K.todos,todos);
  openAddSheet(false);
  renderAgenda();

/* ---------- calendar ---------- */
var calM = now.getMonth(), calY = now.getFullYear(), calSel = TODAY;
function renderCalendar(){
  var vis = visible().filter(function(i){ return i.due && !i.stale; });
  var map = {};
  vis.forEach(function(i){ var k=sod(i.due); (map[k]=map[k]||[]).push(i); });
  var nx = nextItem();
  var first = new Date(calY,calM,1);
  var lead = (first.getDay() - (ui.weekStart === 0 ? 0 : 1) + 7) % 7;
  var start = new Date(calY,calM,1 - lead);
  var dnames = [];
  for(var i=0;i<7;i++) dnames.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i).toLocaleDateString(undefined,{weekday:"short"}));
  var rows = Math.ceil((lead + new Date(calY,calM+1,0).getDate())/7);

  var h = '<div class="calv"><div>';
  h += '<div class="calhead"><h1 class="h1">'+first.toLocaleDateString(undefined,{month:"long"})+'</h1><span class="yr">'+calY+'</span><span class="grow"></span>'+
       '<button class="btn" id="c-today">Today</button>'+
       '<button class="round sm" id="c-prev" aria-label="Previous month">‹</button>'+
       '<button class="round sm" id="c-next" aria-label="Next month">›</button></div>';
  h += '<div class="dows">'+dnames.map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div><div class="month">';
  for(var w=0; w<rows*7; w++){
    var cur = new Date(start.getFullYear(),start.getMonth(),start.getDate()+w);
    var key = sod(cur), evs = (map[key]||[]).sort(function(a,b){ return a.due-b.due; });
    var cls = "cell"+(cur.getMonth()!==calM?" out":"")+(key===TODAY?" today":"")+(key===calSel?" sel":"");
    h += '<button class="'+cls+'" data-day="'+key+'" aria-label="'+esc(cur.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))+', '+evs.length+' due">'+
         '<span class="dn">'+cur.getDate()+'</span>';
    evs.slice(0, evs.length > 3 ? 2 : 3).forEach(function(e){
      var st = isDone(e) ? " done" : isOverdue(e) ? " late" : (nx && e.key === nx.key) ? " next" : examLike(e) ? " exam" : "";
      h += '<span class="chip'+st+'" style="--c:'+courseColor(e)+'">'+icon(kindOf(e),2.6)+'<span>'+esc(e.name)+'</span></span>';
    });
    if(evs.length>3) h += '<span class="more">+'+(evs.length-2)+' more</span>';
    h += '</button>';
  }
  h += '</div></div>';

  var sd = new Date(calSel + 3*36e5), list = (map[calSel]||[]).sort(function(a,b){ return a.due-b.due; });
  h += '<aside class="dayside"><h2>'+esc(sd.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}))+'</h2>'+
       '<div class="sub">'+(calSel===TODAY ? "Today" : calSel < TODAY ? "Past" : dayLabel(calSel).replace(/^in /,"In "))+'</div>';
  h += list.length ? '<ol class="tl">'+list.map(function(i){ return itemRow(i,{next: nx && i.key === nx.key}); }).join('')+'</ol>'
                   : '<p class="msg" style="margin-top:16px">Nothing due this day.</p>';
  h += '</aside></div>';

  document.getElementById("v-calendar").innerHTML = h;
  document.getElementById("c-prev").onclick = function(){ calM--; if(calM<0){calM=11;calY--;} renderCalendar(); };
  document.getElementById("c-next").onclick = function(){ calM++; if(calM>11){calM=0;calY++;} renderCalendar(); };
  document.getElementById("c-today").onclick = function(){ calM=now.getMonth(); calY=now.getFullYear(); calSel=TODAY; renderCalendar(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-day]"), function(b){
    b.onclick = function(){ calSel = +this.getAttribute("data-day"); renderCalendar(); };
  });
}

/* ---------- grades ---------- */
var SKIP = /^(Class Average|Subtotals|Final Grades|Administration|Labs|Assignments|Quizzes|Exams|Tests)$/i;
var SKIP2 = /(Average|Substitution|\(Policy\)|Grade at Midterm|Fall and Spring|Final Pie Progress)/i;
function scorable(g){ return g.p!=null && g.p>0 && !SKIP.test(g.n) && !SKIP2.test(g.n); }
function letter(p){
  if(p>=90) return "A"; if(p>=80) return "B"; if(p>=70) return "C"; if(p>=60) return "D"; return "F";
}
/* One place that turns a class's gradebook into a number, for Grades and
   Classes alike. D2L's own grade wins whenever it shows one: it knows the
   syllabus weights, raw points don't. */
function gradeOf(c){
  var rows = c.grades.filter(scorable);
  /* D2L pre-fills work that hasn't been graded yet as 0, and nothing in these
     pages distinguishes that from an actual zero. Counting them would report
     an F for a course that simply hasn't started marking, so a bare 0 is left
     out; a what-if you typed always counts, zero included. */
  var earned=0, poss=0, entered=0, real=0, zeros=0;
  rows.forEach(function(g){
    var v = whatif[c.id+"|"+g.n];
    var typed = (v!=null && v!=="");
    var n = typed ? parseFloat(v) : (g.e!=null ? g.e : null);
    if(n==null || isNaN(n)) return;
    if(!typed && n === 0){ zeros++; return; }
    earned += n; poss += g.p; entered++;
    if(!typed) real++;
  });
  var raw = poss>0 ? earned/poss*100 : null;
  var fc = c.fc && c.fc.p ? c.fc.e/c.fc.p*100 : null;
  var whatIfs = entered - real;

function ago(ms){
  if(!ms) return null;
  var d = new Date(ms);
  if(sod(d) === TODAY) return "today at "+fmtClock(d);
  if(sod(d) === TODAY-DAY) return "yesterday at "+fmtClock(d);
  return fmtDay(d,true);
}

/* ---------- reminders ---------- */
/* Checked once a minute while the app is open. Each reminder is sent once:
   what went out is remembered by item and kind. */
var SENT_KEY = "owlhours.reminded.v1";
function remindTick(){
  var r = ui.remind || {};
  if(!(r.eve || r.two || r.exam) || typeof Notification === "undefined" || Notification.permission !== "granted") return;
  var sent = load(SENT_KEY, {}), t = Date.now(), changed = false, n = new Date();
  function send(key, title, body){
    if(sent[key]) return;
    sent[key] = t; changed = true;
    try{ new Notification(title, {body: body}); }catch(e){}
  }
  visible().forEach(function(it){
    if(!it.due || it.stale || isDone(it)) return;
    var due = it.due.getTime(), left = due - t;
    if(left <= 0) return;
    var c = byId[it.course], who = c ? c.code+": " : "";
    if(r.exam && examLike(it) && left <= DAY && left > 2*36e5)
      send("exam|"+it.key, "Exam tomorrow", who+it.name+", "+fmtDay(it.due,true)+" at "+fmtSpan(it)+(it.mode === "online" ? ", online" : it.where ? ", "+it.where : ""));
    if(r.two && left <= 2*36e5)
      send("two|"+it.key, "Due in "+countdown(left), who+it.name);
    if(r.eve && n.getHours() >= 20 && sod(it.due) === TODAY + DAY)
      send("eve|"+it.key, "Due tomorrow", who+it.name+" at "+fmtSpan(it));
  });
  if(changed){
    Object.keys(sent).forEach(function(k){ if(t - sent[k] > 14*DAY) delete sent[k]; });
    save(SENT_KEY, sent);
  }
}

/* ---------- the desktop app can talk to D2L itself ---------- */
var DESKTOP = !!(window.owl && window.owl.isDesktop);

/* Items flagged x:1 come from somewhere D2L can't see (ALEKS, hand-added work).
   A refresh replaces the whole dataset, so carry them over or they vanish. */
function keepExtras(next, prev){
  if(!next || !next.courses) return next;
  var mine = {};
  ((prev || DATA).courses||[]).forEach(function(c){
    var extras = (c.items||[]).filter(function(i){ return i.x; });
    if(extras.length) mine[c.id] = extras;
  });
  next.courses.forEach(function(c){
    var extras = mine[c.id];
    if(!extras) return;
    var have = {};
    (c.items||[]).forEach(function(i){ have[i.n] = 1; });
    extras.forEach(function(i){ if(!have[i.n]) (c.items = c.items || []).push(i); });
  });
  return next;
}

function applyData(j, note){
  if(!j || !j.courses || !j.courses.length) return false;
  j = keepExtras(j);
  if(JSON.stringify(j) === JSON.stringify(DATA)){ if(note) note("Already up to date."); return true; }
  save(K.data, j);
  if(note) note("Got "+j.courses.length+" classes. Reloading\u2026");
  setTimeout(function(){ location.reload(); }, note ? 500 : 0);
  return true;
}

function desktopGrab(interactive, note){
  if(!DESKTOP) return;
  if(note) note(interactive ? "Opening D2L\u2026" : "Checking D2L\u2026");
  window.owl.grab(interactive).then(function(res){
    if(res && res.ok){ applyData(res.data, note); return; }
    if(res && res.needLogin){
      if(note) note(interactive ? "Sign-in didn\u2019t finish. Try again." : "You\u2019re signed out of D2L \u2014 press Refresh to sign in.");
      return;
    }
    if(note) note("D2L said: "+((res && res.error) || "something went wrong"));
  }, function(e){ if(note) note("Couldn\u2019t reach D2L: "+e); });
}

var STALE_AFTER = 3 * 24 * 60 * 60 * 1000;   /* nag once ALEKS is 3 days old */
var SNOOZE      = 24 * 60 * 60 * 1000;       /* "not now" keeps quiet for a day */

function alekpState(){ return load(K.aleks, {}); }

function alekpStale(){
  var st = alekpState();
  if(st.snoozeUntil && Date.now() < st.snoozeUntil) return false;
  if(!st.lastPull) return true;                      /* never pulled */
  return (Date.now() - st.lastPull) > STALE_AFTER;
}

function alekpAgeText(){
  var st = alekpState();
  if(!st.lastPull) return "It has never been read.";
  var days = Math.floor((Date.now() - st.lastPull) / 86400000);
  if(days < 1) return "Last read today.";
  return "Last read " + days + " day" + (days === 1 ? "" : "s") + " ago.";
}

/* The one place ALEKS actually gets pulled. */
function pullAleksNow(note, done){
  if(!DESKTOP) return;
  if(note) note("Opening ALEKS\u2026");
  window.owl.pullAleks(courses.map(function(c){ return c.id; })).then(function(res){
    if(!res || !res.ok){
      if(note) note(res && res.needLogin ? "Sign in to D2L first, then try again."
                                         : "Couldn\u2019t read ALEKS: "+((res&&res.error)||"unknown problem"));
      if(done) done(false);
      return;
    }
    var next = JSON.parse(JSON.stringify(DATA)), added = 0;
    res.courses.forEach(function(rc){
      var course = next.courses.filter(function(c){ return c.id === rc.ou; })[0];
      if(!course) return;
      /* drop only the previous ALEKS pull — Gradescope items live here too */
      course.items = (course.items||[]).filter(function(i){ return i.src !== "aleks" && !isLegacyAleks(i); });
      rc.items.forEach(function(i){ course.items.push(i); added++; });
    });
    save(K.data, next);
    var st = alekpState(); st.lastPull = Date.now(); delete st.snoozeUntil; save(K.aleks, st);
    if(note) note("Loaded "+added+" ALEKS item"+(added===1?"":"s")+". Reloading\u2026");
    if(done) done(true);
    setTimeout(function(){ location.reload(); }, 700);
  }, function(e){
    if(note) note("Couldn\u2019t read ALEKS: "+e);
    if(done) done(false);
  });
}

/* Gradescope names a course like "CSE1321L/B03"; the D2L code is "CSE 1321L".
   Compare on letters and digits alone so section suffixes don't defeat it. */
function courseKey(s){
  var m = String(s||"").toUpperCase().match(/[A-Z]{2,5}\s?\d{3,4}[A-Z]?/);
  return m ? m[0].replace(/[^A-Z0-9]/g,"") : "";
}

/* Calendar events, merged in without doubling anything.

   Most of what the calendar holds is already on the page: a quiz normally
   appears there twice (it opens, then it closes) as well as in the quiz list.
   So an event is only added when nothing of that name already exists in the
   course. What survives that filter is the genuinely invisible work — a
   sit-down exam has no dropbox and no quiz object, so the calendar is the only
   place in D2L it exists at all. */
/* Re-adding rows that were just stripped is not a change. Both merges below
   rebuilt their own rows every run, counted that as "added", saved, and
   reloaded — so the window reloaded every ten seconds forever and no banner
   ever stayed on screen long enough to read. Compare the result instead. */
function sameData(a, b){
  try { return JSON.stringify(a) === JSON.stringify(b); } catch(e){ return false; }
}

/* Launch-time pulls are marked only once they FINISH. The D2L refresh reloads
   the page whenever it lands — before a pull starts, or halfway through one —
   and a pull marked at start was lost to that reload and never retried. An
   interrupted pull now simply runs again on the reloaded page. */
function ranThisSession(k){ try { return !!sessionStorage.getItem(k); } catch(e){ return false; } }
function markSession(k){ try { sessionStorage.setItem(k, "1"); } catch(e){} }

/* A launch-time pull should happen once per app session, not once per reload. */
function oncePerSession(k){
  try {
    if(sessionStorage.getItem(k)) return false;
    sessionStorage.setItem(k, "1");
    return true;
  } catch(e){ return true; }
}

function calKey(n){
  return String(n||"").toLowerCase()
    .replace(/\(scheduled\)|\(gradescope\)|\(aleks\)/g,"")
    .replace(/[^a-z0-9]+/g," ").trim();
}

function pullCalendar(note, done){
  if(!DESKTOP){ if(done) done(false); return; }
  var ous = (DATA.courses||[]).map(function(c){ return c.id; }).filter(Boolean);
  if(!ous.length){ if(done) done(false); return; }

  window.owl.pullCalendar(ous).then(function(res){
    if(!res || !res.ok){
      if(note) note(res && res.needLogin ? "Sign in to D2L to read your calendar."
                                         : "Couldn’t read the calendar: "+((res&&res.error)||"unknown problem"));
      if(done) done(false, res && res.needLogin);
      return;
    }
    var m = mergeCalendar(DATA, res), next = m.next, added = m.added, exams = m.exams, removed = m.removed;

    /* A clean-up with nothing added is still a change worth saving. */
    if(sameData(next, DATA)){
      if(note) note("Nothing new in the calendar.");
      if(done) done(false);
      return;
    }
    save(K.data, next);
    if(note) note("Calendar: "+added+" added, "+removed+" replaced or removed"
                  +(exams?", including "+exams+" exam"+(exams===1?"":"s"):"")+". Reloading…");
    if(done) done(true);
    setTimeout(function(){ location.reload(); }, 700);
  }, function(){ if(done) done(false); });
}

/* Folds a calendar pull into a copy of \`base\`; \`base\` itself is untouched. */
function mergeCalendar(base, res){
    var next = JSON.parse(JSON.stringify(base));
    var added = 0, exams = 0, removed = 0;

    next.courses.forEach(function(c){
      /* Clear last run's calendar rows in EVERY course, before asking whether
         this run found anything. Doing it after the early return below meant a
         course whose events were all filtered out (COMM 1100's bulk-stamped
         textbook chapters) kept its stale rows forever. */
      var before = (c.items||[]).length;
      c.items = (c.items||[]).filter(function(i){ return i.src !== "cal"; });
      removed += before - c.items.length;

      var mine = res.items.filter(function(i){ return i.ou === c.id; });
      if(!mine.length) return;

      var have = {};
      (c.items||[]).forEach(function(i){ have[calKey(i.n)] = 1; });

      var seen = {};
      mine.forEach(function(i){
        var k = calKey(i.n);
        if(have[k] || seen[k]) return;      // already known, or a duplicate within the calendar itself
        seen[k] = 1;
        var row = JSON.parse(JSON.stringify(i));
        delete row.ou;
        c.items.push(row);
        added++;
        if(row.exam) exams++;
      });
    });
    return { next: next, added: added, exams: exams, removed: removed };
}

function pullGradescope(interactive, note, done){
  if(!DESKTOP) return;
  window.owl.pullGradescope(!!interactive).then(function(res){
    if(!res || !res.ok){
      if(note) note(res && res.needLogin ? "Sign in to Gradescope to pull your work."
                                         : "Couldn\u2019t read Gradescope: "+((res&&res.error)||"unknown problem"));
      if(done) done(false, res && res.needLogin);
      return;
    }
    var m = mergeGradescope(DATA, res), next = m.next, added = m.added, unmatched = m.unmatched;
    if(!added){
      if(note) note(unmatched.length ? "Gradescope has "+esc(unmatched.join(", "))+", which doesn\u2019t match any D2L class."
                                     : "Nothing new from Gradescope.");
      if(done) done(false);
      return;
    }
    if(sameData(next, DATA)){
      var st0 = load(K.gs,{}); st0.lastPull = Date.now(); save(K.gs, st0);
      if(note) note("Nothing new from Gradescope.");
      if(done) done(false);
      return;
    }
    save(K.data, next);
    var st = load(K.gs,{}); st.lastPull = Date.now(); save(K.gs, st);
    if(note) note("Loaded "+added+" Gradescope item"+(added===1?"":"s")+". Reloading\u2026");
    if(done) done(true);
    setTimeout(function(){ location.reload(); }, 700);
  }, function(e){
    if(note) note("Couldn\u2019t read Gradescope: "+e);
    if(done) done(false);
  });
}

function mergeGradescope(base, res){
  var next = JSON.parse(JSON.stringify(base));
  var added = 0, unmatched = [];
  res.courses.forEach(function(gc){
    var key = courseKey(gc.code) || courseKey(gc.name);
    var course = next.courses.filter(function(c){ return courseKey(c.code) === key; })[0];
    if(!course){ unmatched.push(gc.code || gc.name); return; }
    course.items = (course.items||[]).filter(function(i){ return i.src !== "gs"; });
    gc.items.forEach(function(i){ course.items.push(i); added++; });
  });
  return { next: next, added: added, unmatched: unmatched };
}

/* Everything the app reads on launch, at once, with one reload at the end.
   D2L, Gradescope and the calendar used to take turns: D2L landed and
   reloaded the page, which restarted a 6-second Gradescope timer, whose
   reload restarted a 9-second calendar timer — about 20 seconds and three
   reloads before the page was whole. They are independent reads, so they now
   run side by side and are folded into one dataset before anything reloads. */
function launchRefresh(){
  var ids = function(d){ return ((d && d.courses)||[]).map(function(c){ return c.id; }).filter(Boolean); };
  var none = function(){ return null; };
  /* a source the user disconnected in Sync stays unread */
  var gsP  = ui.gsOff ? null : window.owl.pullGradescope(false).then(null, none);
  /* The calendar is read per course. On a first launch there are no courses
     yet, so it has to wait for D2L to say what they are. */
  var calP = (!ui.calOff && ids(DATA).length) ? window.owl.pullCalendar(ids(DATA)).then(null, none) : null;

  window.owl.grab(false).then(null, none).then(function(d2l){
    var fresh = d2l && d2l.ok && d2l.data && d2l.data.courses && d2l.data.courses.length;
    if(d2l && d2l.needLogin && !isEmpty) showSignInBar();
    var base = fresh ? keepExtras(d2l.data, DATA) : JSON.parse(JSON.stringify(DATA));
    if(!calP && !ui.calOff && ids(base).length) calP = window.owl.pullCalendar(ids(base)).then(null, none);

    return Promise.all([gsP, calP]).then(function(r){
      var next = base, gs = r[0], cal = r[1];
      if(gs && gs.ok){
        next = mergeGradescope(next, gs).next;
        var st = load(K.gs,{}); st.lastPull = Date.now(); save(K.gs, st);
      }
      if(cal && cal.ok) next = mergeCalendar(next, cal).next;
      /* Exams live only in the calendar, so a lapsed sign-in there is worth
         saying out loud — unless the D2L bar already said it. */
      else if(cal && cal.needLogin && !(d2l && d2l.needLogin)){
        showSignInBar("Your exams live only in the D2L calendar, and Owl Hours can\u2019t read it until you sign in.");
      }
      markSession("owlhours.launch");
      if(!sameData(next, DATA)){ save(K.data, next); location.reload(); }
    });
  });
}

/* Offer it rather than doing it: pulling signs the user out of ALEKS, so that

/* ---------- pulling data from a URL ---------- */
function b64bytes(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }

/* An encrypted payload looks like {v:1,alg:"AES-GCM",iv,ct}. The key rides in the
   URL's #k= fragment, which browsers never send to the server, so whoever hosts
   the file only ever holds ciphertext. */
function decryptIfNeeded(obj, keyB64){
  if(!obj || obj.alg !== "AES-GCM") return Promise.resolve(obj);
  if(!keyB64) return Promise.reject(new Error("this data is encrypted and the address is missing its #k= key"));
  if(!(window.crypto && window.crypto.subtle)) return Promise.reject(new Error("this browser can't decrypt (needs a secure connection)"));
  return window.crypto.subtle.importKey("raw", b64bytes(keyB64), "AES-GCM", false, ["decrypt"])
    .then(function(key){
      return window.crypto.subtle.decrypt({name:"AES-GCM", iv:b64bytes(obj.iv)}, key, b64bytes(obj.ct));
    })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); })
    .catch(function(){ throw new Error("wrong key for this data"); });
}

function pullSync(silent, say){
  if(!sync.url) return;
  var hash = sync.url.indexOf("#k=");
  var url  = hash >= 0 ? sync.url.slice(0, hash) : sync.url;
  var key  = hash >= 0 ? decodeURIComponent(sync.url.slice(hash + 3)) : null;
  fetch(url, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("the address returned "+r.status);
    return r.json();
  }).then(function(raw){
    return decryptIfNeeded(raw, key);
  }).then(function(j){
    if(!j || !j.courses || !j.courses.length) throw new Error("no classes in that data");
    j = keepExtras(j);
    if(JSON.stringify(j) === JSON.stringify(DATA)){ if(say) say("Already up to date."); return; }
    save(K.data, j);
    /* one reload per page-open, so an auto-pull can never spin */
    try{ if(silent){ if(sessionStorage.getItem("owlhours.pulled")) return; sessionStorage.setItem("owlhours.pulled","1"); } }catch(e){}
    if(say) say("Got "+j.courses.length+" classes. Reloading\u2026");
    setTimeout(function(){ location.reload(); }, say ? 600 : 0);
  }).catch(function(e){
    if(say) say("Could not pull: "+e.message);
  });
}

/* ---------- telling people there's a newer version ----------
   Two different situations. The web app can update itself: the service worker
   fetches the new build and we just need the page reloaded. A downloaded .dmg
   or .exe cannot, so there we point at the release and let them fetch it. */

function cmpVersion(a, b){
  var x = String(a).replace(/^v/,"").split("."), y = String(b).replace(/^v/,"").split(".");
  for(var i=0;i<Math.max(x.length,y.length);i++){
    var d = (parseInt(x[i],10)||0) - (parseInt(y[i],10)||0);
    if(d) return d < 0 ? -1 : 1;
  }
  return 0;
}

function showUpdateBar(html, wire){
  var bar = document.getElementById("updatebar");
  bar.innerHTML = '<div class="ubar-in"><span class="dotpulse"></span>'+html+
                  '<button class="udismiss">Not now</button></div>';
  bar.classList.remove("hidden");
  if(wire) wire(bar);
  bar.querySelector(".udismiss").onclick = function(){ bar.classList.add("hidden"); };
}

/* the page itself was redeployed — reloading is all it takes */
function offerReload(reg){
  var upd = load(K.upd,{});
  showUpdateBar('<span class="utext"><b>A new version is ready.</b> Reload to get it.</span>'+
                '<button class="ubtn" id="u-reload">Reload</button>', function(bar){
    bar.querySelector("#u-reload").onclick = function(){
      this.textContent = "Reloading\u2026";
      var w = reg && reg.waiting;
      if(w){
        /* the new worker is parked until told to take over */
        navigator.serviceWorker.addEventListener("controllerchange", function once(){
          navigator.serviceWorker.removeEventListener("controllerchange", once);
          location.reload();
        });
        w.postMessage({type:"SKIP_WAITING"});
        setTimeout(function(){ location.reload(); }, 1500);   // fallback
      } else {
        location.reload();
      }
    };
  });
}

/* a newer release exists but this copy is an installed binary */
function offerDownload(tag, url){
  var upd = load(K.upd,{});
  if(upd.dismissed === tag) return;
  showUpdateBar('<span class="utext"><b>Version '+esc(tag)+' is out.</b> You have '+esc(APP_VERSION)+
                '. Downloaded apps don\u2019t update themselves.</span>'+
                '<a class="ubtn" href="'+esc(url)+'" target="_blank" rel="noopener">Get it</a>',
    function(bar){
      bar.querySelector(".udismiss").addEventListener("click", function(){
        upd.dismissed = tag; save(K.upd, upd);
      });
    });
}

   The old banner just linked to GitHub and left you to find the right file.

   the update, so the whole thing is: press Update, press Restart. */
function updBar(html, wire){ showUpdateBar('<span class="utext">'+html+'</span>', wire); }

function offerRestart(version){

                '<button class="ubtn" id="u-restart">Restart now</button>', function(bar){
    bar.querySelector("#u-restart").onclick = function(){
      this.disabled = true; this.textContent = "Restarting…";
      window.owl.updateInstall();
    };
  });
}

/* If an update can't finish — no permission to replace the app, running from
   the disk image, a failed download — say why and hand over the download. */
function updateFailed(u){
  var url = "https://github.com/" + REPO + "/releases/latest";
  showUpdateBar('<span class="utext"><b>Update failed.</b> '+esc((u&&u.message)||"Unknown problem")+'</span>'+
                '<a class="ubtn" href="'+esc(url)+'" target="_blank" rel="noopener">Download</a>');
}

function wireAutoUpdate(){
  if(!DESKTOP || !window.owl || !window.owl.onUpdate) return;
  window.owl.onUpdate(function(u){
    if(!u) return;
    if(u.state === "available")        offerAutoUpdate(u.version);
    else if(u.state === "downloading") updateProgress(u.percent);
    else if(u.state === "ready")       offerRestart(u.version);
    else if(u.state === "error")       updateFailed(u);
  });
}

function checkForUpdate(){
  if(APP_VERSION === "dev") return;
  var upd = load(K.upd,{});
  var SIX_HOURS = 6*60*60*1000;
  if(upd.checkedAt && (Date.now() - upd.checkedAt) < SIX_HOURS){
    if(upd.latest && cmpVersion(APP_VERSION, upd.latest) < 0) offerDownload(upd.latest, upd.url);
    return;
  }
  fetch("https://api.github.com/repos/"+REPO+"/releases/latest", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      var tag = (j.tag_name||"").replace(/^v/,"");
      if(!tag) return;
      save(K.upd, {checkedAt: Date.now(), latest: tag, url: j.html_url});
      if(cmpVersion(APP_VERSION, tag) < 0) offerDownload(tag, j.html_url);
    })
    .catch(function(){ /* offline, rate-limited, or blocked — never worth interrupting anyone */ });
}

function watchForNewBuild(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.getRegistration().then(function(reg){
    if(!reg) return;
    if(reg.waiting && navigator.serviceWorker.controller){ offerReload(reg); return; }
    reg.addEventListener("updatefound", function(){
      var sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", function(){
        /* "installed" with an existing controller means this is a replacement,
           not the very first install */
        if(sw.state === "installed" && navigator.serviceWorker.controller) offerReload(reg);
      });
    });
    reg.update().catch(function(){});
  }).catch(function(){});
}

if(DESKTOP && !PERSONAL){ wireAutoUpdate(); checkForUpdate(); }
else if(!DESKTOP) watchForNewBuild();

/* ---------- shell ---------- */
var VIEWS = ["agenda","calendar","classes","grades","sync","settings"];
function show(v){
  /* Before any classes are loaded there is nothing to plan, so the first
     screen explains what Owl Hours is and how to start. Sync and Settings
     still open, so the web version can reach its grabber. */
  var welcome = isEmpty && v !== "sync" && v !== "settings";
  ui.view = v; save(K.ui,ui);
  document.getElementById("v-welcome").classList.toggle("hidden", !welcome);
  VIEWS.forEach(function(n){
    document.getElementById("v-"+n).classList.toggle("hidden", welcome || n!==v);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.setAttribute("aria-selected", String(t.getAttribute("data-view")===v && !welcome));
  });
  document.getElementById("fab").classList.toggle("hidden", welcome || v !== "agenda");
  openAddSheet(false);
  if(welcome){ renderWelcome(); window.scrollTo(0,0); return; }
  if(v==="agenda") renderAgenda();
  if(v==="calendar") renderCalendar();
  if(v==="classes") renderClasses();
  if(v==="grades") renderGrades();
  if(v==="sync") renderSync();
  if(v==="settings") renderSettings();
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function(b){
  b.onclick = function(){ show(this.getAttribute("data-view")); };
});
document.getElementById("fab").onclick = function(){ openAddSheet(document.getElementById("addsheet").classList.contains("hidden")); };

document.addEventListener("click", function(e){
  var chk = e.target.closest ? e.target.closest("[data-check]") : null;
  if(!chk) return;
  var k = chk.getAttribute("data-check");
  var item = allItems().filter(function(i){ return i.key === k; })[0];
  done[k] = item ? (isDone(item) ? 0 : 1) : (done[k] ? 0 : 1);
  save(K.done, done);
  if(ui.view==="agenda") renderAgenda();
  else if(ui.view==="calendar") renderCalendar();
  else if(ui.view==="classes") renderClasses();
});

/* "Updated 3:08 AM": when D2L was last read */
(function(){
  var el = document.getElementById("updated");
  if(!DATA.scrapedAt || isEmpty){ el.textContent = ""; return; }
  var d = new Date(DATA.scrapedAt);
  el.textContent = "Updated " + (sod(d) === TODAY ? fmtClock(d) : fmtDay(d));
})();

if(DESKTOP){
  var rb = document.getElementById("btn-refresh");
  rb.style.display = isEmpty ? "none" : "";
  rb.onclick = function(){
    var b = this;
    b.disabled = true; b.classList.add("spin"); b.setAttribute("aria-label","Refreshing");
    var restore = function(){ b.disabled = false; b.classList.remove("spin"); b.setAttribute("aria-label","Refresh from D2L"); };
    desktopGrab(true, function(s){
      if(/signed out|sign-in|sign in/i.test(s)){ restore(); showSignInBar(); return; }
      if(/Reloading/.test(s)) return;
      restore();
      /* D2L is done. ALEKS is a separate system with its own cost, so ask. */
      offerAleks();
    });
    setTimeout(restore, 8000);
  };
}

show(VIEWS.indexOf(ui.view)>=0 ? ui.view : "agenda");
if(sync.auto && sync.url) pullSync(true, null);
/* Nobody has to remember the button exists: if ALEKS has gone stale, say so. */
if(DESKTOP) setTimeout(offerAleks, 4000);
remindTick();
/* The app can stay open for days. Once a minute, move "now" forward so the
   next-item countdown and "Today" stay true, without disturbing typing. */
setInterval(function(){
  now = new Date(); TODAY = sod(now);
  remindTick();
  var a = document.activeElement, busy = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(!busy && document.getElementById("addsheet").classList.contains("hidden")){
    if(ui.view === "agenda" && !isEmpty) renderAgenda();
  }
}, 60000);
})();
</script>
