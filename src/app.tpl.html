<title>Owl Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#FAF8F2; --panel:#FFFFFF; --panel-2:#F3EFE4; --panel-3:#EDE8DA;
  --ink:#1A1813; --muted:#6B6558; --faint:#958E7D; --line:#E5DFD1;
  --gold:#9A7400; --gold-ink:#6E5300; --gold-soft:rgba(154,116,0,.13);
  --red:#A93A2A; --red-soft:rgba(169,58,42,.10);
  --green:#3B7A56; --green-soft:rgba(59,122,86,.12);
  --c1:#3F6D9E; --c2:#6C5CA8; --c3:#2F7D63; --c4:#A05C86; --c5:#8A6E2A; --c6:#4A6E78;
  --shadow:0 1px 2px rgba(26,24,19,.05), 0 8px 24px -12px rgba(26,24,19,.16);
  --r:10px;
  --display:"Familjen Grotesk", "Trebuchet MS", sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14130F; --panel:#1D1B16; --panel-2:#25221B; --panel-3:#2E2A21;
    --ink:#F2EDE0; --muted:#A79E8A; --faint:#7B7466; --line:#332F25;
    --gold:#E8B33E; --gold-ink:#F0C86F; --gold-soft:rgba(232,179,62,.16);
    --red:#E2705C; --red-soft:rgba(226,112,92,.15);
    --green:#6FBF8E; --green-soft:rgba(111,191,142,.15);
    --c1:#7FAAD8; --c2:#A796E0; --c3:#6BC49E; --c4:#D492BA; --c5:#C9A857; --c6:#85AEB8;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#14130F; --panel:#1D1B16; --panel-2:#25221B; --panel-3:#2E2A21;
  --ink:#F2EDE0; --muted:#A79E8A; --faint:#7B7466; --line:#332F25;
  --gold:#E8B33E; --gold-ink:#F0C86F; --gold-soft:rgba(232,179,62,.16);
  --red:#E2705C; --red-soft:rgba(226,112,92,.15);
  --green:#6FBF8E; --green-soft:rgba(111,191,142,.15);
  --c1:#7FAAD8; --c2:#A796E0; --c3:#6BC49E; --c4:#D492BA; --c5:#C9A857; --c6:#85AEB8;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:20px;font-weight:700}
.brand .term{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tabs{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:var(--r)}
.tab{border:0;background:transparent;padding:7px 13px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.icon-btn:hover{border-color:var(--gold);color:var(--ink)}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.cols{display:grid;grid-template-columns:1fr 288px;gap:26px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}.rail{order:-1}}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:78px}
@media (max-width:900px){.rail{position:static}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600}
.card-b{padding:14px 16px}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;position:relative;overflow:hidden}
.tile .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.tile.crit{background:var(--red-soft);border-color:transparent}
.tile.crit .n{color:var(--red)}
.tile.warn{background:var(--gold-soft);border-color:transparent}
.tile.warn .n{color:var(--gold)}

/* ---------- agenda ---------- */
.bucket{margin-bottom:26px}
.bucket-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bucket-h h2{font-size:14px;font-weight:600}
.bucket-h .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);background:var(--panel-2);padding:1px 7px;border-radius:20px}
.bucket-h .rule{flex:1;height:1px;background:var(--line)}
.bucket.is-overdue .bucket-h h2{color:var(--red)}
.bucket.is-now .bucket-h h2{color:var(--gold)}

.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--stripe,var(--line));border-radius:var(--r);padding:11px 14px 11px 12px;transition:border-color .12s,transform .12s}
.row:hover{border-color:var(--line);border-left-color:var(--stripe,var(--line));transform:translateX(1px)}
.row.done{opacity:.45}
.row.done .r-name{text-decoration:line-through}
.chk{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.chk:hover{border-color:var(--green)}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chk svg{width:11px;height:11px;display:none}
.chk[aria-pressed="true"] svg{display:block}
.r-main{min-width:0}
.r-name{font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.r-name a{color:inherit;text-decoration:none}
.r-name a:hover{color:var(--gold-ink);text-decoration:underline}
.r-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px}
.r-when{text-align:right;flex:0 0 auto}
.r-when .abs{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.r-when .rel{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;margin-top:2px}
.r-when .rel.hot{color:var(--gold);font-weight:600}
.r-when .rel.late{color:var(--red);font-weight:600}

.pill{font-size:10.5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.course{background:transparent;border:1px solid currentColor;font-weight:500}
.pill.pts{background:var(--panel-2);color:var(--muted)}
.pill.stale{background:var(--gold-soft);color:var(--gold)}
.pill.miss{background:var(--red-soft);color:var(--red)}
.pill.todo{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* ---------- filters ---------- */
.filters{display:flex;flex-direction:column;gap:7px}
.fchip{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;width:100%;font-size:13px;color:var(--muted)}
.fchip:hover{background:var(--panel-2)}
.fchip[aria-pressed="true"]{color:var(--ink);font-weight:500}
.fchip[aria-pressed="false"]{opacity:.4}
.fchip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip .ct{font-family:var(--mono);font-size:11px;color:var(--faint)}

.toggles{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.toggles label{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggles input{accent-color:var(--gold);width:15px;height:15px}

/* ---------- add todo ---------- */
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.addbar input[type=text]{flex:1;min-width:170px}
.inp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13.5px}
.inp:focus{border-color:var(--gold);outline:none}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}

/* ---------- calendar ---------- */
.cal-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-top h2{font-size:19px;font-weight:600;min-width:180px}
.grid-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dow{background:var(--panel-2);padding:7px 9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center}
.day{background:var(--panel);min-height:104px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.day:hover{background:var(--panel-2)}
.day.out{background:var(--bg);opacity:.5}
.day.sel{background:var(--gold-soft)}
.day .dn{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.day.today .dn{background:var(--gold);color:#fff;border-radius:50%;width:21px;height:21px;display:grid;place-items:center;font-weight:600}
.ev{font-size:10.5px;padding:2px 5px;border-radius:4px;background:var(--panel-2);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2.5px solid var(--stripe)}
.ev.late{background:var(--red-soft)}
.more{font-family:var(--mono);font-size:10px;color:var(--faint);padding-left:4px}
.daydetail{margin-top:16px}

/* ---------- classes ---------- */
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.cls-h{padding:14px 16px;border-bottom:1px solid var(--line);border-top:3px solid var(--stripe);border-radius:var(--r) var(--r) 0 0}
.cls-h h3{font-size:15.5px;font-weight:600;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.cls-h .code{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
.cls-b{padding:6px 16px 14px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.mini:last-child{border-bottom:0}
.mini .mn{min-width:0;overflow-wrap:anywhere}
.mini .md{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted);padding:8px 0}

/* ---------- grades ---------- */
.gr-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:14px 16px;border-top:3px solid var(--stripe);border-bottom:1px solid var(--line)}
.gr-head h3{font-size:15.5px;font-weight:600;flex:1;min-width:180px}
.gr-score{text-align:right}
.gr-score .pc{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1}
.gr-score .lt{font-size:11px;color:var(--faint);font-family:var(--mono);letter-spacing:.06em;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.score-in{width:64px;text-align:right;background:var(--panel-2);border:1px solid transparent;border-radius:6px;padding:3px 7px;font-family:var(--mono);font-size:13px}
.score-in:focus{border-color:var(--gold);background:var(--panel);outline:none}
.score-in.filled{background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.note{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:8px;padding:9px 12px;margin:12px 16px 14px;line-height:1.45}

/* ---------- sync ---------- */
.sync{max-width:720px}
.step{display:grid;grid-template-columns:26px 1fr;gap:13px;margin-bottom:20px}
.step .k{font-family:var(--mono);font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:600}
.step h4{font-size:14px;font-weight:600;margin-bottom:4px}
.step p{margin:0 0 9px;font-size:13.5px;color:var(--muted);max-width:62ch}
.bmk{display:inline-block;background:var(--gold);color:#fff;border-radius:8px;padding:8px 15px;font-weight:600;font-size:13.5px;text-decoration:none;cursor:grab}
textarea.inp{width:100%;min-height:96px;font-family:var(--mono);font-size:11.5px;resize:vertical}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-family:var(--mono)}
details.br{border:1px solid var(--line);border-radius:8px;margin-top:9px;background:var(--panel-2)}
details.br summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:500;list-style:none}
details.br summary::-webkit-details-marker{display:none}
details.br summary:before{content:'\25B8';display:inline-block;margin-right:8px;color:var(--gold);transition:transform .15s}
details.br[open] summary:before{transform:rotate(90deg)}
details.br .bd{padding:2px 12px 12px 12px;font-size:13px;color:var(--muted);line-height:1.55}
details.br ol{margin:0;padding-left:19px}
details.br li{margin-bottom:5px}
details.br kbd{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.empty{text-align:center;padding:44px 20px;color:var(--faint)}
.empty p{margin:6px 0 0;font-size:13.5px}
.hidden{display:none !important}

/* update banner */
.ubar{background:var(--gold-soft);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:39}
.ubar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px}
.ubar .dotpulse{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){
  .ubar .dotpulse{animation:upulse 2.4s ease-in-out infinite}
  @keyframes upulse{0%,100%{opacity:1}50%{opacity:.35}}
}
.ubar .utext{flex:1;min-width:180px;color:var(--ink)}
.ubar .utext b{font-weight:600}
.ubar a.ubtn,.ubar button.ubtn{background:var(--gold);color:#fff;border:0;border-radius:7px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.ubar button.udismiss{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.ubar button.udismiss:hover{color:var(--ink)}
.vstamp{font-family:var(--mono);font-size:11px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div class="bar">
  <div class="bar-in">
    <div class="brand">
      <h1>Owl Hours</h1>
      <span class="term">Fall 2026 &middot; Kennesaw State</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="agenda" aria-selected="true">Agenda</button>
      <button class="tab" role="tab" data-view="calendar" aria-selected="false">Calendar</button>
      <button class="tab" role="tab" data-view="classes" aria-selected="false">Classes</button>
      <button class="tab" role="tab" data-view="grades" aria-selected="false">Grades</button>
    </div>
    <button class="icon-btn" id="btn-refresh" style="display:none">Refresh</button>
    <button class="icon-btn" data-view="sync">Sync D2L</button>
  </div>
</div>

<div id="updatebar" class="ubar hidden"></div>

<div class="wrap">
  <div id="v-agenda"></div>
  <div id="v-calendar" class="hidden"></div>
  <div id="v-classes" class="hidden"></div>
  <div id="v-grades" class="hidden"></div>
  <div id="v-sync" class="hidden"></div>
</div>

<script>
(function(){
"use strict";

var DEFAULT_DATA = /*__DATA__*/null;
var APP_VERSION  = /*__VERSION__*/"dev";
/* A personal build carries its own coursework. Downloading the public
   release would replace it with an empty one, so never offer that here. */
var PERSONAL     = /*__PERSONAL__*/false;
var REPO         = "Unknownce0/owl-hours";

/* Fall 2026 term window. Anything due outside this is a leftover from a
   copied-forward course shell, not something you actually owe. */
var TERM_START = new Date(2026,7,1).getTime();
var TERM_END   = new Date(2027,0,15).getTime();

var K = {data:"owlhours.data.v1", done:"owlhours.done.v1", todos:"owlhours.todos.v1",
         whatif:"owlhours.whatif.v1", ui:"owlhours.ui.v1", sync:"owlhours.sync.v1",
         upd:"owlhours.update.v1", aleks:"owlhours.aleks.v1"};

function load(k,f){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var stored   = load(K.data,null);
var DATA     = stored || DEFAULT_DATA || {v:1,courses:[]};
var isCustom = !!stored;
var isEmpty  = !DATA.courses || !DATA.courses.length;
var sync     = load(K.sync,{url:"",auto:false});
var done     = load(K.done,{});
var todos    = load(K.todos,[]);
var whatif   = load(K.whatif,{});
var ui       = load(K.ui,{view:"agenda",hideDone:false,hideStale:false,off:{}});
if(!ui.off) ui.off={};

var TYPE = {a:"assignment", q:"quiz", d:"discussion"};
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };

/* ---------- shaping the raw D2L dump into things with dates and identity ---------- */
function courseCode(t){
  var m = t.match(/\b([A-Z]{2,4})\s?(\d{4}[A-Z]?)\b/);
  if(m) return m[1]+" "+m[2];
  var w = t.replace(/\b(Section|Group|XLS|Lab|Fall|Semester|CO)\b/g,"").trim().split(/\s+/);
  return w.slice(0,2).join(" ").toUpperCase();
}
function courseName(t){
  return t.replace(/\s+Section\s+\w+/,"").replace(/\s+XLS\s+Group(\s+\w+)?/,"")
          .replace(/\s+Lab\b/," Lab").replace(/\s+CSE\s?\d{4}[A-Z]?/,"").trim();
}
var courses = (DATA.courses||[]).map(function(c,i){
  return { id:c.id, raw:c.title, name:courseName(c.title), code:c.code||courseCode(c.title),
           color:"var(--c"+((i%6)+1)+")", idx:i, grades:c.grades||[], fc:c.fc||null };
});
var byId = {}; courses.forEach(function(c){ byId[c.id]=c; });

var items = [];
(DATA.courses||[]).forEach(function(c){
  (c.items||[]).forEach(function(it){
    var due = it.d ? new Date(it.d) : null;
    var t   = TYPE[it.t] || "item";
    items.push({
      key: c.id+"|"+it.t+"|"+it.n,
      course: c.id, type: t, name: it.n,
      due: due, opens: it.o?new Date(it.o):null,
      url: it.u ? "https://kennesaw.view.usg.edu"+it.u : null,
      status: it.s||null, points: (it.p!=null?it.p:null),
      attempts: it.at, maxAttempts: it.am, section: it.sec||null,
      stale: !!(due && (due.getTime()<TERM_START || due.getTime()>TERM_END)),
      todo:false
    });
  });
});
function allItems(){
  return items.concat(todos.map(function(t){
    return { key:"todo|"+t.id, course:t.course||"", type:"todo", name:t.name,
             due:t.due?new Date(t.due):null, opens:null, url:null, status:null,
             points:null, stale:false, todo:true, tid:t.id };
  }));
}

/* ---------- time ---------- */
var now = new Date();
function sod(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }
var TODAY = sod(now);
var DAY = 864e5;
function daysOut(d){ return Math.round((sod(d)-TODAY)/DAY); }
function fmtDate(d){
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
    (d.getFullYear()!==2026 ? ", "+d.getFullYear() : "");
}
function fmtTime(d){
  var h=d.getHours(), m=d.getMinutes();
  if(h===23&&m>=58) return "11:59p";
  return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}).replace(/\s?([AP])M/i,function(_,a){return a.toLowerCase();});
}
function relative(d){
  var n = daysOut(d);
  if(n===0){
    var hrs = Math.round((d.getTime()-now.getTime())/36e5);
    if(hrs<0) return {t:"overdue",c:"late"};
    if(hrs<=1) return {t:"< 1 hr",c:"late"};
    return {t:"in "+hrs+" hr",c:"hot"};
  }
  if(n<0)  return {t:Math.abs(n)+"d ago", c:"late"};
  if(n===1) return {t:"tomorrow", c:"hot"};
  if(n<=7) return {t:"in "+n+"d", c:"hot"};
  return {t:"in "+n+"d", c:""};
}

/* ---------- filtering ---------- */
/* D2L and ALEKS already tell us what is finished - a submission status, a score,
   a closed assignment. Read that instead of waiting to be told twice.
   done[key] is the manual override: 1 = ticked by hand, 0 = un-ticked by hand. */
function autoDone(it){
  if(it.todo) return false;
  var s = it.status || "";
  if(/not submitted|not started|no submission/i.test(s)) return false;
  /* D2L writes "1 Submission, 1 File" for handed-in work - note "Submission",
     not "Submitted", which an obvious-looking regex misses entirely. */
  if(/\d+\s*submission/i.test(s)) return true;
  if(/submitted|completed|graded|closed|feedback/i.test(s)) return true;
  if(it.earned != null) return true;
  /* A quiz you have sat is done. D2L reports this as an attempt count -
     "1 / Unlimited" for taken, "0 / Unlimited" for not. */
  if(it.attempts != null && it.attempts > 0) return true;
  return false;
}
function isDone(it){
  var m = done[it.key];
  if(m === 1) return true;
  if(m === 0) return false;
  return autoDone(it);
}

function visible(){
  return allItems().filter(function(it){
    if(it.course && ui.off[it.course]) return false;
    if(ui.hideDone && isDone(it)) return false;
    return true;
  });
}
function bucketOf(it){
  if(it.stale) return "stale";
  if(!it.due)  return "undated";
  var n = daysOut(it.due);
  if(it.due.getTime() < now.getTime() && n<=0) return "overdue";
  if(n===0) return "today";
  if(n===1) return "tomorrow";
  if(n<=7)  return "week";
  return "later";
}
var BUCKETS = [
  {k:"overdue",  label:"Overdue",             cls:"is-overdue"},
  {k:"today",    label:"Today",               cls:"is-now"},
  {k:"tomorrow", label:"Tomorrow",            cls:"is-now"},
  {k:"week",     label:"Next 7 days",         cls:""},
  {k:"later",    label:"Later this term",     cls:""},
  {k:"undated",  label:"No due date in D2L",  cls:""},
  {k:"stale",    label:"Check these dates",   cls:""}
];

/* ---------- row rendering ---------- */
function pill(txt,cls,style){ return '<span class="pill '+(cls||"")+'"'+(style?' style="'+style+'"':"")+'>'+esc(txt)+'</span>'; }

function rowHTML(it){
  var c = byId[it.course];
  var complete = isDone(it);
  var stripe = it.todo ? "var(--gold)" : (c?c.color:"var(--line)");
  var h = '<div class="row'+(complete?" done":"")+'" style="--stripe:'+stripe+'">';
  h += '<button class="chk" aria-pressed="'+complete+'" data-check="'+esc(it.key)+'" aria-label="Mark '+esc(it.name)+' done">'+
       '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.2 4.4 9.2 10.5 2.8"/></svg></button>';
  h += '<div class="r-main"><div class="r-name">'+
       (it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.name)+'</a>':esc(it.name))+
       '</div><div class="r-meta">';
  if(c) h += '<span class="pill course" style="color:'+c.color+'">'+esc(c.code)+'</span>';
  h += pill(it.todo?"my task":it.type);
  if(it.points!=null) h += pill(it.points+" pts","pts");
  if(it.status && /Not Submitted/i.test(it.status)) h += pill("not submitted","miss");
  if(it.attempts != null) h += pill(it.maxAttempts ? it.attempts+"/"+it.maxAttempts+" attempts"
                                                    : it.attempts+(it.attempts===1?" attempt":" attempts"),"pts");
  if(it.stale) h += pill("date looks stale","stale");
  if(complete && done[it.key] !== 1) h += pill(/closed|completed/i.test(it.status||"") ? "done" : "submitted","ok");
  h += '</div></div>';
  h += '<div class="r-when">';
  if(it.due){
    var r = relative(it.due);
    h += '<div class="abs mono">'+fmtDate(it.due)+' &middot; '+fmtTime(it.due)+'</div>';
    h += '<div class="rel mono '+(it.stale?"":r.c)+'">'+(it.stale?"from a past term":r.t)+'</div>';
  } else {
    h += '<div class="rel mono">no date</div>';
  }
  h += '</div></div>';
  if(it.todo) h = h.replace('</div>\n','</div>');
  return h;
}

/* ---------- agenda ---------- */
function renderAgenda(){
  if(isEmpty){
    document.getElementById("v-agenda").innerHTML =
      '<div class="empty" style="padding:70px 20px">'+
      '<h2 style="font-size:22px;margin-bottom:8px">Nothing loaded yet</h2>'+
      '<p style="max-width:44ch;margin:0 auto 20px">'+
      (DESKTOP ? 'Sign in to D2L once and Owl Hours keeps itself up to date from then on. '+
                 'Your coursework stays on this computer.'
               : 'Owl Hours needs one trip to D2L to pull in your classes. '+
                 'It takes about five seconds, and your coursework stays on this device.')+'</p>'+
      '<button class="btn" id="empty-cta">'+(DESKTOP ? 'Sign in to D2L' : 'Get my classes')+'</button>'+
      '<p class="sub" id="empty-msg" style="margin-top:14px"></p></div>';
    document.getElementById("empty-cta").onclick = function(){
      if(DESKTOP){
        var m = document.getElementById("empty-msg");
        desktopGrab(true, function(s){ m.textContent = s; });
      } else { show("sync"); }
    };
    if(DESKTOP) window.owl.onStatus(function(s){
      var m = document.getElementById("empty-msg"); if(m) m.textContent = s;
    });
    return;
  }
  var vis = visible();
  var groups = {}; BUCKETS.forEach(function(b){ groups[b.k]=[]; });
  vis.forEach(function(it){ var b=bucketOf(it); if(groups[b]) groups[b].push(it); });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(a,b){
      if(!a.due) return 1; if(!b.due) return -1;
      return a.due-b.due;
    });
  });

  var live = vis.filter(function(i){ return !i.stale && !isDone(i); });
  var overdue = groups.overdue.filter(function(i){ return !isDone(i); }).length;
  var wk = live.filter(function(i){ var n=i.due?daysOut(i.due):null; return n!=null && n>=0 && n<=7; }).length;
  var unsub = vis.filter(function(i){ return i.status && /Not Submitted/i.test(i.status) && !isDone(i); }).length;
  var staleN = vis.filter(function(i){ return i.stale; }).length;

  var body = '';
  body += '<div class="addbar">';
  body += '<input class="inp" type="text" id="td-name" placeholder="Add your own &mdash; readings, study blocks, anything D2L doesn&rsquo;t track">';
  body += '<select class="inp" id="td-course"><option value="">No class</option>'+
          courses.map(function(c){ return '<option value="'+c.id+'">'+esc(c.code)+'</option>'; }).join('')+'</select>';
  body += '<input class="inp" type="date" id="td-due">';
  body += '<button class="btn" id="td-add">Add</button></div>';

  var any = false;
  BUCKETS.forEach(function(b){
    var g = groups[b.k];
    if(ui.hideStale && b.k==="stale") return;
    if(!g.length) return;
    any = true;
    body += '<section class="bucket '+b.cls+'"><div class="bucket-h"><h2>'+b.label+'</h2>'+
            '<span class="cnt mono">'+g.length+'</span><span class="rule"></span></div>'+
            '<div class="rows">'+g.map(rowHTML).join('')+'</div></section>';
  });
  if(!any) body += '<div class="empty"><h2>Nothing matches</h2><p>Every class is filtered out, or you&rsquo;ve checked it all off.</p></div>';

  var rail = '';
  rail += '<div class="tiles">'+
    tile(wk, wk===1?"due in the next 7 days":"due in the next 7 days", wk>0?"warn":"")+
    tile(overdue, overdue===1?"overdue item":"overdue items", overdue>0?"crit":"")+
    tile(unsub,"marked not submitted","")+
    tile(staleN,"dates to verify","")+
  '</div>';

  rail += '<div class="card"><div class="card-h"><h3>Classes</h3></div><div class="card-b"><div class="filters">'+
    courses.map(function(c){
      var n = allItems().filter(function(i){ return i.course===c.id && !i.stale && !isDone(i); }).length;
      var on = !ui.off[c.id];
      return '<button class="fchip" aria-pressed="'+on+'" data-filter="'+c.id+'">'+
             '<span class="dot" style="background:'+c.color+'"></span>'+
             '<span class="nm">'+esc(c.name)+'</span><span class="ct mono">'+n+'</span></button>';
    }).join('')+'</div></div></div>';

  rail += '<div class="card"><div class="card-h"><h3>View</h3></div><div class="card-b"><div class="toggles">'+
    '<label><input type="checkbox" id="t-done"'+(ui.hideDone?" checked":"")+'> Hide completed</label>'+
    '<label><input type="checkbox" id="t-stale"'+(ui.hideStale?" checked":"")+'> Hide stale dates</label>'+
    '</div></div></div>';

  document.getElementById("v-agenda").innerHTML =
    '<div class="cols"><div>'+body+'</div><aside class="rail">'+rail+'</aside></div>';

  var add = document.getElementById("td-add");
  if(add) add.onclick = addTodo;
  var nm = document.getElementById("td-name");
  if(nm) nm.onkeydown = function(e){ if(e.key==="Enter") addTodo(); };
  var td=document.getElementById("t-done"); if(td) td.onchange=function(){ ui.hideDone=this.checked; save(K.ui,ui); renderAgenda(); };
  var ts=document.getElementById("t-stale"); if(ts) ts.onchange=function(){ ui.hideStale=this.checked; save(K.ui,ui); renderAgenda(); };
}
function tile(n,label,cls){
  return '<div class="tile '+cls+'"><div class="n">'+n+'</div><div class="l">'+esc(label)+'</div></div>';
}
function addTodo(){
  var n = document.getElementById("td-name");
  if(!n || !n.value.trim()) return;
  var d = document.getElementById("td-due").value;
  todos.push({ id:Date.now().toString(36), name:n.value.trim(),
               course:document.getElementById("td-course").value,
               due: d ? new Date(d+"T23:59:00").toISOString() : null });
  save(K.todos,todos);
  n.value=""; document.getElementById("td-due").value="";
  renderAgenda();
}

/* ---------- calendar ---------- */
var calM = now.getMonth(), calY = now.getFullYear(), calSel = null;
function renderCalendar(){
  var vis = visible().filter(function(i){ return i.due && !i.stale; });
  var map = {};
  vis.forEach(function(i){ var k=sod(i.due); (map[k]=map[k]||[]).push(i); });

  var first = new Date(calY,calM,1);
  var start = new Date(calY,calM,1 - first.getDay());
  var dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  var h = '<div class="cal-top">'+
    '<h2>'+first.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</h2>'+
    '<button class="icon-btn" id="c-prev" aria-label="Previous month">&larr;</button>'+
    '<button class="icon-btn" id="c-today">Today</button>'+
    '<button class="icon-btn" id="c-next" aria-label="Next month">&rarr;</button></div>';

  h += '<div class="grid-scroll"><div class="cal">'+dows.map(function(d){ return '<div class="dow">'+d+'</div>'; }).join('');
  for(var w=0; w<6; w++){
    for(var d=0; d<7; d++){
      var cur = new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7+d);
      var key = sod(cur), evs = map[key]||[];
      var cls = "day" + (cur.getMonth()!==calM?" out":"") + (key===TODAY?" today":"") + (key===calSel?" sel":"");
      h += '<button class="'+cls+'" data-day="'+key+'"><span class="dn">'+cur.getDate()+'</span>';
      evs.slice(0,3).forEach(function(e){
        var c = byId[e.course];
        h += '<span class="ev'+(key<TODAY&&!isDone(e)?" late":"")+'" style="--stripe:'+(e.todo?"var(--gold)":(c?c.color:"var(--line)"))+'">'+esc(e.name)+'</span>';
      });
      if(evs.length>3) h += '<span class="more mono">+'+(evs.length-3)+' more</span>';
      h += '</button>';
    }
  }
  h += '</div></div>';

  if(calSel && map[calSel]){
    var sd = new Date(calSel);
    h += '<div class="daydetail"><div class="bucket-h"><h2>'+
         sd.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+
         '</h2><span class="cnt mono">'+map[calSel].length+'</span><span class="rule"></span></div>'+
         '<div class="rows">'+map[calSel].sort(function(a,b){return a.due-b.due;}).map(rowHTML).join('')+'</div></div>';
  } else {
    h += '<p class="sub" style="margin-top:14px">Pick a day to see everything due on it.</p>';
  }

  document.getElementById("v-calendar").innerHTML = h;
  document.getElementById("c-prev").onclick = function(){ calM--; if(calM<0){calM=11;calY--;} calSel=null; renderCalendar(); };
  document.getElementById("c-next").onclick = function(){ calM++; if(calM>11){calM=0;calY++;} calSel=null; renderCalendar(); };
  document.getElementById("c-today").onclick = function(){ calM=now.getMonth(); calY=now.getFullYear(); calSel=TODAY; renderCalendar(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-day]"), function(b){
    b.onclick = function(){ calSel = +this.getAttribute("data-day"); renderCalendar(); };
  });
}

/* ---------- classes ---------- */
function renderClasses(){
  var all = allItems();
  var h = '<div class="cls-grid">';
  courses.forEach(function(c){
    var mine = all.filter(function(i){ return i.course===c.id; });
    var live = mine.filter(function(i){ return !i.stale && i.due; }).sort(function(a,b){ return a.due-b.due; });
    var undated = mine.filter(function(i){ return !i.due && !i.stale; });
    var stale = mine.filter(function(i){ return i.stale; });
    h += '<div class="card" style="--stripe:'+c.color+'"><div class="cls-h"><h3>'+esc(c.name)+'</h3>'+
         '<div class="code mono">'+esc(c.code)+' &middot; ou='+c.id+'</div></div><div class="cls-b">';
    if(!mine.length){
      h += '<p class="sub">No assignments, quizzes, or discussions in D2L. This class runs its work somewhere else &mdash; check ALEKS or your syllabus.</p>';
    } else {
      if(live.length){
        live.slice(0,14).forEach(function(i){
          var r = relative(i.due);
          h += '<div class="mini"><span class="mn'+(isDone(i)?'" style="opacity:.45;text-decoration:line-through':'')+'">'+esc(i.name)+'</span>'+
               '<span class="md" style="'+(r.c==="late"?"color:var(--red)":r.c==="hot"?"color:var(--gold)":"")+'">'+fmtDate(i.due)+'</span></div>';
        });
        if(live.length>14) h += '<p class="sub">+ '+(live.length-14)+' more with dates</p>';
      }
      if(undated.length) h += '<p class="sub">'+undated.length+' item'+(undated.length>1?"s":"")+' with no due date (discussions, drop boxes).</p>';
      if(stale.length)   h += '<p class="sub">'+stale.length+' item'+(stale.length>1?"s":"")+' dated outside this term &mdash; verify before trusting.</p>';
    }
    h += '</div></div>';
  });
  h += '</div>';
  document.getElementById("v-classes").innerHTML = h;
}

/* ---------- grades ---------- */
var SKIP = /^(Class Average|Subtotals|Final Grades|Administration|Labs|Assignments|Quizzes|Exams|Tests)$/i;
var SKIP2 = /(Average|Substitution|\(Policy\)|Grade at Midterm|Fall and Spring|Final Pie Progress)/i;
function scorable(g){ return g.p!=null && g.p>0 && !SKIP.test(g.n) && !SKIP2.test(g.n); }
function letter(p){
  if(p>=90) return "A"; if(p>=80) return "B"; if(p>=70) return "C"; if(p>=60) return "D"; return "F";
}
function renderGrades(){
  var h = '';
  courses.forEach(function(c){
    var rows = c.grades.filter(scorable);
    /* Real scores come from D2L. A what-if entry, when present, replaces one so
       you can see where a hypothetical result would land you. */
    /* D2L pre-fills work that hasn't been graded yet as 0, and nothing in these
       pages distinguishes that from an actual zero. Counting them would report
       an F for a course that simply hasn't started marking, so a bare 0 is left
       out; a what-if you typed always counts, zero included. */
    var earned=0, poss=0, entered=0, real=0, zeros=0;
    rows.forEach(function(g){
      var k = c.id+"|"+g.n;
      var v = whatif[k];
      var typed = (v!=null && v!=="");
      var n = typed ? parseFloat(v) : (g.e!=null ? g.e : null);
      if(n==null || isNaN(n)) return;
      if(!typed && n === 0){ zeros++; return; }
      earned += n; poss += g.p; entered++;
      if(!typed) real++;
    });
    var pct = poss>0 ? (earned/poss*100) : null;
    h += '<div class="card" style="--stripe:'+c.color+';margin-bottom:18px">';
    var fc = c.fc;
    var fcPct = fc && fc.p ? (fc.e/fc.p*100) : null;
    h += '<div class="gr-head"><h3>'+esc(c.name)+'</h3>';
    if(fc){
      h += '<div class="gr-score"><div class="pc" style="color:'+c.color+'">'+fcPct.toFixed(1)+'%</div>'+
           '<div class="lt">D2L&rsquo;S GRADE'+(fc.g?" &middot; "+esc(fc.g):"")+'</div></div>';
    }
    h += '<div class="gr-score">'+
         '<div class="pc" style="color:'+(pct==null?"var(--faint)":"var(--muted)")+'">'+(pct==null?"&mdash;":pct.toFixed(1)+"%")+'</div>'+
         '<div class="lt">'+(pct==null?"NOTHING GRADED YET"
            : (entered-real>0 ? "WITH YOUR WHAT-IFS" : "FROM "+entered+" GRADED")+" &middot; "+letter(pct))+'</div></div></div>';
    if(!rows.length){
      h += '<p class="note">No point-bearing grade items in D2L for this class yet.</p>';
    } else {
      h += '<div class="grid-scroll"><table><thead><tr><th>Grade item</th><th style="text-align:right">Score</th><th style="text-align:right">%</th><th style="text-align:right">What if&hellip;</th></tr></thead><tbody>';
      rows.forEach(function(g){
        var k = c.id+"|"+g.n;
        var v = whatif[k]==null?"":whatif[k];
        var actual = g.e!=null ? g.e : null;
        var shown = v!=="" ? v : (actual!=null ? String(actual) : "");
        var pctCell = actual!=null && g.p ? (actual/g.p*100).toFixed(0)+"%" : "&mdash;";
        h += '<tr><td>'+esc(g.n)+'</td>'+
             '<td class="num">'+(actual!=null?esc(String(actual)):"&mdash;")+' / '+g.p+'</td>'+
             '<td class="num">'+pctCell+'</td>'+
             '<td class="num"><input class="score-in'+(v!==""?" filled":"")+'" inputmode="decimal" value="'+esc(shown)+'" data-wi="'+esc(k)+'" aria-label="What-if score for '+esc(g.n)+'"></td></tr>';
      });
      h += '</tbody></table></div>';
      h += '<p class="note">'+(fc ? '<strong>D2L&rsquo;s grade is the real one.</strong> ' : '')+
           'The second figure totals raw points across everything scored. D2L doesn&rsquo;t expose category weights through these pages, so where your syllabus weights categories the two will differ &mdash; trust D2L&rsquo;s. '+
           'Type over any score to see where a different result would put you.</p>'+
           (zeros ? '<p class="note" style="margin-top:0">'+zeros+' item'+(zeros>1?'s show':' shows')+' as 0 in D2L. Nothing here can tell a real zero from work that just hasn&rsquo;t been marked, so '+(zeros>1?'they are':'it is')+' left out of the figure above rather than counted as failure. Type a score in if you know it.</p>' : '');
    }
    h += '</div>';
  });
  document.getElementById("v-grades").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll("[data-wi]"), function(inp){
    inp.oninput = function(){
      whatif[this.getAttribute("data-wi")] = this.value;
      save(K.whatif,whatif);
      clearTimeout(inp._t);
      inp._t = setTimeout(function(){
        var a = document.activeElement, id = a && a.getAttribute ? a.getAttribute("data-wi") : null;
        renderGrades();
        if(id){ var n = document.querySelector('[data-wi="'+id.replace(/"/g,'\\"')+'"]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }
      }, 420);
    };
  });
}

/* ---------- sync ---------- */
var SCRAPER = "javascript:(function(){var M={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};"+
"var R=/([A-Z][a-z]{2})\\s+(\\d{1,2}),\\s+(\\d{4})(?:\\s+(\\d{1,2}):(\\d{2})\\s*(AM|PM))?/g;"+
"var cl=function(s){return (s||'').replace(/\\s+/g,' ').trim()},tx=function(e){return e?cl(e.innerText||e.textContent):''};"+
"var CUT=/\\s*(Available on|Available until|Due on|Starts|Ends|Access restricted|Opens|Closes)\\b/;"+

/* ---------- the desktop app can talk to D2L itself ---------- */
var DESKTOP = !!(window.owl && window.owl.isDesktop);

/* Items flagged x:1 come from somewhere D2L can't see (ALEKS, hand-added work).
   A refresh replaces the whole dataset, so carry them over or they vanish. */
function keepExtras(next){
  if(!next || !next.courses) return next;
  var mine = {};
  (DATA.courses||[]).forEach(function(c){
    var extras = (c.items||[]).filter(function(i){ return i.x; });
    if(extras.length) mine[c.id] = extras;
  });
  next.courses.forEach(function(c){
    var extras = mine[c.id];
    if(!extras) return;
    var have = {};
    (c.items||[]).forEach(function(i){ have[i.n] = 1; });
    extras.forEach(function(i){ if(!have[i.n]) (c.items = c.items || []).push(i); });
  });
  return next;
}

function applyData(j, note){
  if(!j || !j.courses || !j.courses.length) return false;
  j = keepExtras(j);
  if(JSON.stringify(j) === JSON.stringify(DATA)){ if(note) note("Already up to date."); return true; }
  save(K.data, j);
  if(note) note("Got "+j.courses.length+" classes. Reloading\u2026");
  setTimeout(function(){ location.reload(); }, note ? 500 : 0);
  return true;
}

function desktopGrab(interactive, note){
  if(!DESKTOP) return;
  if(note) note(interactive ? "Opening D2L\u2026" : "Checking D2L\u2026");
  window.owl.grab(interactive).then(function(res){
    if(res && res.ok){ applyData(res.data, note); return; }
    if(res && res.needLogin){
      if(note) note(interactive ? "Sign-in didn\u2019t finish. Try again." : "You\u2019re signed out of D2L \u2014 press Refresh to sign in.");
      return;
    }
    if(note) note("D2L said: "+((res && res.error) || "something went wrong"));
  }, function(e){ if(note) note("Couldn\u2019t reach D2L: "+e); });
}

var STALE_AFTER = 3 * 24 * 60 * 60 * 1000;   /* nag once ALEKS is 3 days old */
var SNOOZE      = 24 * 60 * 60 * 1000;       /* "not now" keeps quiet for a day */

function alekpState(){ return load(K.aleks, {}); }

function alekpStale(){
  var st = alekpState();
  if(st.snoozeUntil && Date.now() < st.snoozeUntil) return false;
  if(!st.lastPull) return true;                      /* never pulled */
  return (Date.now() - st.lastPull) > STALE_AFTER;
}

function alekpAgeText(){
  var st = alekpState();
  if(!st.lastPull) return "It has never been read.";
  var days = Math.floor((Date.now() - st.lastPull) / 86400000);
  if(days < 1) return "Last read today.";
  return "Last read " + days + " day" + (days === 1 ? "" : "s") + " ago.";
}

/* The one place ALEKS actually gets pulled. */
function pullAleksNow(note, done){
  if(!DESKTOP) return;
  if(note) note("Opening ALEKS\u2026");
  window.owl.pullAleks(courses.map(function(c){ return c.id; })).then(function(res){
    if(!res || !res.ok){
      if(note) note(res && res.needLogin ? "Sign in to D2L first, then try again."
                                         : "Couldn\u2019t read ALEKS: "+((res&&res.error)||"unknown problem"));
      if(done) done(false);
      return;
    }
    var next = JSON.parse(JSON.stringify(DATA)), added = 0;
    res.courses.forEach(function(rc){
      var course = next.courses.filter(function(c){ return c.id === rc.ou; })[0];
      if(!course) return;
      course.items = (course.items||[]).filter(function(i){ return !i.x; });
      rc.items.forEach(function(i){ course.items.push(i); added++; });
    });
    save(K.data, next);
    var st = alekpState(); st.lastPull = Date.now(); delete st.snoozeUntil; save(K.aleks, st);
    if(note) note("Loaded "+added+" ALEKS item"+(added===1?"":"s")+". Reloading\u2026");
    if(done) done(true);
    setTimeout(function(){ location.reload(); }, 700);
  }, function(e){
    if(note) note("Couldn\u2019t read ALEKS: "+e);
    if(done) done(false);
  });
}

/* Offer it rather than doing it: pulling signs the user out of ALEKS, so that
   has to be their call, made at the moment it matters. */
function offerAleks(){
  if(!DESKTOP || !alekpStale()) return;
  window.owl.checkAleks(courses.map(function(c){ return c.id; })).then(function(ous){
    if(!ous || !ous.length) return;                 /* no ALEKS classes — say nothing */
    var names = ous.map(function(o){
      var c = byId[o]; return c ? c.code : o;
    }).join(", ");
    showUpdateBar('<span class="utext"><b>Also refresh ALEKS?</b> '+esc(names)+' runs its work there and D2L can&rsquo;t see it. '+
      esc(alekpAgeText())+' This signs you out of ALEKS everywhere else.</span>'+
      '<button class="ubtn" id="u-aleks">Refresh ALEKS</button>', function(bar){
        bar.querySelector("#u-aleks").onclick = function(){
          var b = this; b.disabled = true; b.textContent = "Reading\u2026";
          pullAleksNow(function(s){ bar.querySelector(".utext").textContent = s; },
                       function(ok){ if(!ok){ b.disabled = false; b.textContent = "Refresh ALEKS"; } });
        };
        bar.querySelector(".udismiss").addEventListener("click", function(){
          var st = alekpState(); st.snoozeUntil = Date.now() + SNOOZE; save(K.aleks, st);
        });
      });
  }).catch(function(){});
}

/* When Kennesaw's sign-in lapses the app can't see new work. Say so plainly
   rather than sitting there looking up to date, and put the fix one click away. */
function showSignInBar(note){
  showUpdateBar('<span class="utext"><b>Your D2L sign-in has expired.</b> '+
    (note || 'Owl Hours can&rsquo;t see new work until you sign in again.')+'</span>'+
    '<button class="ubtn" id="u-signin">Sign in to D2L</button>', function(bar){
      bar.querySelector("#u-signin").onclick = function(){
        var b = this;
        b.disabled = true; b.textContent = "Opening D2L\u2026";
        desktopGrab(true, function(s){
          var msg = bar.querySelector(".utext");
          if(/Reloading|up to date/i.test(s)){
            b.textContent = "Signed in";
            msg.innerHTML = "<b>Signed in.</b> Bringing everything up to date\u2026";
          } else {
            b.disabled = false; b.textContent = "Sign in to D2L";
            msg.textContent = s;
          }
        });
      };
    });
}

if(DESKTOP){
  window.owl.onData(function(j){ applyData(j, null); });
  window.owl.onNeedLogin(function(){ showSignInBar(); });
}

/* ---------- pulling data from a URL ---------- */
function b64bytes(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }

/* An encrypted payload looks like {v:1,alg:"AES-GCM",iv,ct}. The key rides in the
   URL's #k= fragment, which browsers never send to the server, so whoever hosts
   the file only ever holds ciphertext. */
function decryptIfNeeded(obj, keyB64){
  if(!obj || obj.alg !== "AES-GCM") return Promise.resolve(obj);
  if(!keyB64) return Promise.reject(new Error("this data is encrypted and the address is missing its #k= key"));
  if(!(window.crypto && window.crypto.subtle)) return Promise.reject(new Error("this browser can't decrypt (needs a secure connection)"));
  return window.crypto.subtle.importKey("raw", b64bytes(keyB64), "AES-GCM", false, ["decrypt"])
    .then(function(key){
      return window.crypto.subtle.decrypt({name:"AES-GCM", iv:b64bytes(obj.iv)}, key, b64bytes(obj.ct));
    })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); })
    .catch(function(){ throw new Error("wrong key for this data"); });
}

function pullSync(silent, say){
  if(!sync.url) return;
  var hash = sync.url.indexOf("#k=");
  var url  = hash >= 0 ? sync.url.slice(0, hash) : sync.url;
  var key  = hash >= 0 ? decodeURIComponent(sync.url.slice(hash + 3)) : null;
  fetch(url, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("the address returned "+r.status);
    return r.json();
  }).then(function(raw){
    return decryptIfNeeded(raw, key);
  }).then(function(j){
    if(!j || !j.courses || !j.courses.length) throw new Error("no classes in that data");
    j = keepExtras(j);
    if(JSON.stringify(j) === JSON.stringify(DATA)){ if(say) say("Already up to date."); return; }
    save(K.data, j);
    /* one reload per page-open, so an auto-pull can never spin */
    try{ if(silent){ if(sessionStorage.getItem("owlhours.pulled")) return; sessionStorage.setItem("owlhours.pulled","1"); } }catch(e){}
    if(say) say("Got "+j.courses.length+" classes. Reloading\u2026");
    setTimeout(function(){ location.reload(); }, say ? 600 : 0);
  }).catch(function(e){
    if(say) say("Could not pull: "+e.message);
  });
}

/* ---------- telling people there's a newer version ----------
   Two different situations. The web app can update itself: the service worker
   fetches the new build and we just need the page reloaded. A downloaded .dmg
   or .exe cannot, so there we point at the release and let them fetch it. */

function cmpVersion(a, b){
  var x = String(a).replace(/^v/,"").split("."), y = String(b).replace(/^v/,"").split(".");
  for(var i=0;i<Math.max(x.length,y.length);i++){
    var d = (parseInt(x[i],10)||0) - (parseInt(y[i],10)||0);
    if(d) return d < 0 ? -1 : 1;
  }
  return 0;
}

function showUpdateBar(html, wire){
  var bar = document.getElementById("updatebar");
  bar.innerHTML = '<div class="ubar-in"><span class="dotpulse"></span>'+html+
                  '<button class="udismiss" aria-label="Dismiss">&times;</button></div>';
  bar.classList.remove("hidden");
  if(wire) wire(bar);
  bar.querySelector(".udismiss").onclick = function(){ bar.classList.add("hidden"); };
}

/* the page itself was redeployed — reloading is all it takes */
function offerReload(reg){
  var upd = load(K.upd,{});
  showUpdateBar('<span class="utext"><b>A new version is ready.</b> Reload to get it.</span>'+
                '<button class="ubtn" id="u-reload">Reload</button>', function(bar){
    bar.querySelector("#u-reload").onclick = function(){
      this.textContent = "Reloading\u2026";
      var w = reg && reg.waiting;
      if(w){
        /* the new worker is parked until told to take over */
        navigator.serviceWorker.addEventListener("controllerchange", function once(){
          navigator.serviceWorker.removeEventListener("controllerchange", once);
          location.reload();
        });
        w.postMessage({type:"SKIP_WAITING"});
        setTimeout(function(){ location.reload(); }, 1500);   // fallback
      } else {
        location.reload();
      }
    };
  });
}

/* a newer release exists but this copy is an installed binary */
function offerDownload(tag, url){
  var upd = load(K.upd,{});
  if(upd.dismissed === tag) return;
  showUpdateBar('<span class="utext"><b>Version '+esc(tag)+' is out.</b> You have '+esc(APP_VERSION)+
                '. Downloaded apps don\u2019t update themselves.</span>'+
                '<a class="ubtn" href="'+esc(url)+'" target="_blank" rel="noopener">Get it</a>',
    function(bar){
      bar.querySelector(".udismiss").addEventListener("click", function(){
        upd.dismissed = tag; save(K.upd, upd);
      });
    });
}

function checkForUpdate(){
  if(APP_VERSION === "dev") return;
  var upd = load(K.upd,{});
  var SIX_HOURS = 6*60*60*1000;
  if(upd.checkedAt && (Date.now() - upd.checkedAt) < SIX_HOURS){
    if(upd.latest && cmpVersion(APP_VERSION, upd.latest) < 0) offerDownload(upd.latest, upd.url);
    return;
  }
  fetch("https://api.github.com/repos/"+REPO+"/releases/latest", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      var tag = (j.tag_name||"").replace(/^v/,"");
      if(!tag) return;
      save(K.upd, {checkedAt: Date.now(), latest: tag, url: j.html_url});
      if(cmpVersion(APP_VERSION, tag) < 0) offerDownload(tag, j.html_url);
    })
    .catch(function(){ /* offline, rate-limited, or blocked — never worth interrupting anyone */ });
}

function watchForNewBuild(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.getRegistration().then(function(reg){
    if(!reg) return;
    if(reg.waiting && navigator.serviceWorker.controller){ offerReload(reg); return; }
    reg.addEventListener("updatefound", function(){
      var sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", function(){
        /* "installed" with an existing controller means this is a replacement,
           not the very first install */
        if(sw.state === "installed" && navigator.serviceWorker.controller) offerReload(reg);
      });
    });
    reg.update().catch(function(){});
  }).catch(function(){});
}

if(DESKTOP && !PERSONAL) checkForUpdate(); else if(!DESKTOP) watchForNewBuild();

/* ---------- shell ---------- */
var VIEWS = ["agenda","calendar","classes","grades","sync"];
function show(v){
  ui.view = v; save(K.ui,ui);
  VIEWS.forEach(function(n){
    document.getElementById("v-"+n).classList.toggle("hidden", n!==v);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.setAttribute("aria-selected", String(t.getAttribute("data-view")===v));
  });
  if(v==="agenda") renderAgenda();
  if(v==="calendar") renderCalendar();
  if(v==="classes") renderClasses();
  if(v==="grades") renderGrades();
  if(v==="sync") renderSync();
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function(b){
  b.onclick = function(){ show(this.getAttribute("data-view")); };
});

document.addEventListener("click", function(e){
  var chk = e.target.closest ? e.target.closest("[data-check]") : null;
  if(chk){
    var k = chk.getAttribute("data-check");
    var item = allItems().filter(function(i){ return i.key === k; })[0];
    done[k] = item ? (isDone(item) ? 0 : 1) : (done[k] ? 0 : 1);
    save(K.done, done);
    if(ui.view==="agenda") renderAgenda();
    else if(ui.view==="calendar") renderCalendar();
    else if(ui.view==="classes") renderClasses();
    return;
  }
  var f = e.target.closest ? e.target.closest("[data-filter]") : null;
  if(f){
    var id = f.getAttribute("data-filter");
    if(ui.off[id]) delete ui.off[id]; else ui.off[id] = 1;
    save(K.ui, ui);
    renderAgenda();
  }
});

if(DESKTOP){
  var rb = document.getElementById("btn-refresh");
  rb.style.display = "";
  rb.onclick = function(){
    var b = this, label = b.textContent;
    b.textContent = "Refreshing\u2026"; b.disabled = true;
    var restore = function(){ b.textContent = label; b.disabled = false; };
    desktopGrab(true, function(s){
      if(/signed out|sign-in|sign in/i.test(s)){ restore(); showSignInBar(); return; }
      if(/Reloading/.test(s)){ b.textContent = "Done"; return; }
      restore();
      /* D2L is done. ALEKS is a separate system with its own cost, so ask.
         Gating this on the result text missed the paths that don't produce one;
         if a reload is coming instead, the launch-time offer covers it. */
      offerAleks();
    });
    setTimeout(restore, 8000);
  };
}

show(VIEWS.indexOf(ui.view)>=0 ? ui.view : "agenda");
if(sync.auto && sync.url) pullSync(true, null);
/* Nobody has to remember the button exists: if ALEKS has gone stale, say so. */
if(DESKTOP) setTimeout(offerAleks, 4000);
})();
</script>
